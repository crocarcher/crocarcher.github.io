<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Crocodile Archer - Defend the Swamp | Free Retro Bow and Arrow Game</title>
<meta name="description" content="Crocodile Archer is a free browser game in the style of the classic Bow and Arrow arcade cabinet. Ten stages of balloons, turtles, sharks, submarines and a bullseye range. Plays on desktop and mobile, no download needed.">
<meta name="author" content="Ecowisdom Knowledge Ventures">
<meta name="theme-color" content="#0b1a12">
<link rel="canonical" href="https://crocarcher.github.io/">
<meta property="og:type" content="website">
<meta property="og:title" content="Crocodile Archer - Defend the Swamp">
<meta property="og:description" content="A free retro bow and arrow arcade game. Ten stages, one life, and a very long quiver.">
<meta property="og:url" content="https://crocarcher.github.io/">
<meta name="twitter:card" content="summary_large_image">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:#0b1a12;
    background-image:radial-gradient(circle at 50% 0%, #17301f 0%, #0b1a12 55%, #050d08 100%);
    font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;
    overflow:hidden;-webkit-tap-highlight-color:transparent;
    color:#dce8dd;
  }
  #app{
    height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;padding:8px;
  }

  /* ---------- the control bar, always outside the playfield ---------- */
  #bar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    width:100%;max-width:1040px;
  }
  #bar .brand{
    font-family:"Courier New",monospace;color:#c9a227;font-size:14px;
    letter-spacing:2px;margin-right:auto;white-space:nowrap;
  }
  .btn{
    font-family:"Courier New",monospace;font-size:12px;letter-spacing:1px;
    color:#e9f5ec;background:rgba(8,22,16,.75);
    border:2px solid #6b4a1f;border-radius:6px;
    padding:8px 12px;cursor:pointer;white-space:nowrap;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s,background .15s;
  }
  .btn:hover{border-color:#c9a227;background:rgba(20,44,30,.9);}
  .btn:active{transform:scale(.97);}
  .btn.on{border-color:#c9a227;color:#ffd45e;}
  .btn[disabled]{opacity:.35;cursor:default;}
  .btn svg{width:14px;height:14px;fill:currentColor;}

  /* ---------- the playfield and the two touch pads beside it ---------- */
  #stage{display:flex;align-items:stretch;gap:8px;width:100%;justify-content:center;min-height:0;}
  #frame{
    position:relative;border:6px solid #6b4a1f;border-radius:10px;
    box-shadow:0 0 0 3px #2b1c0a,0 18px 50px rgba(0,0,0,.75),inset 0 0 0 2px #a5772f;
    overflow:hidden;background:#000;flex:0 1 auto;min-width:0;
  }
  canvas{display:block;width:100%;height:auto;touch-action:none;}
  canvas{cursor:default;}
  body.playingMouse canvas{cursor:none;}

  /* pads and labels are HIDDEN by default and only appear in real touch mode.
     !important so no later id-selector can accidentally reveal them on desktop. */
  #padL,#padR,.padLabel{display:none !important;}
  body.touch #padL{display:flex !important;}
  body.touch #padR{display:flex !important;}
  body.touch .padLabel{display:flex !important;}

  /* ---- phone-only controls: top ad, single pause button, pause menu ---- */
  #phoneAd, #phonePause, #phoneMenu{display:none;}

  /* the single pause button sits low in the right column, clear of the FIRE circle */
  #phonePause{
    margin-top:auto;margin-bottom:6px;
    width:34px;height:34px;border-radius:8px;
    background:rgba(8,22,16,.85);border:2px solid #6b4a1f;color:#ffd45e;
    font-family:"Courier New",monospace;font-size:14px;font-weight:bold;
    cursor:pointer;flex:0 0 auto;letter-spacing:1px;
  }
  #phonePause:active{transform:scale(.94);}
  body.touch #padR{flex-direction:column;justify-content:space-between;}

  /* the thin rotating ad across the top, only during phone play */
  #phoneAd{
    width:100%;flex:0 0 auto;
    align-items:center;gap:8px;
    border:2px solid #c9a227;border-radius:6px;
    background:rgba(8,22,16,.8);padding:3px 8px;
    text-decoration:none;overflow:hidden;
    animation:slotGlow 10s ease-in-out infinite;
  }
  #phoneAd .pa-logo{width:26px;height:26px;flex:0 0 26px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Courier New",monospace;font-size:11px;color:#fff;font-weight:bold;}
  #phoneAd .pa-logo img{width:100%;height:100%;object-fit:cover;}
  #phoneAd .pa-txt{flex:1;min-width:0;font-family:"Courier New",monospace;
    font-size:10px;color:#ffd45e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;}
  #phoneAd .pa-go{flex:0 0 auto;font-family:"Courier New",monospace;font-size:10px;
    padding:4px 9px;border-radius:3px;font-weight:bold;white-space:nowrap;
    animation:btnFlash 2s steps(1) infinite;text-decoration:none;}

  /* the phone pause menu */
  #phoneMenu{
    position:fixed;inset:0;z-index:45;
    background:rgba(4,12,8,.9);
    align-items:center;justify-content:center;
  }
  #phoneMenu.show{display:flex;}
  #phoneMenu .pmCard{
    background:linear-gradient(180deg,#f4e6c4 0%,#e8d5a8 55%,#d9c08a 100%);
    border:3px solid #8a6a2f;border-radius:10px;padding:16px 20px;text-align:center;
    display:flex;flex-direction:column;gap:8px;min-width:220px;
  }
  #phoneMenu .pmTitle{font-family:"Courier New",monospace;font-size:20px;color:#7b1f14;
    letter-spacing:2px;font-weight:bold;margin-bottom:4px;}
  #phoneMenu .pmBtn{
    font-family:"Courier New",monospace;font-size:14px;letter-spacing:1px;
    padding:10px 14px;border-radius:6px;cursor:pointer;font-weight:bold;
    background:#fbf3dd;border:2px solid #8a6a2f;color:#3b2a12;
  }
  #phoneMenu .pmBtn:active{transform:scale(.97);}
  #phoneMenu #pmResume{background:rgba(201,162,39,.45);color:#7b1f14;border-color:#7b1f14;}

  body.touch #phonePause{display:flex;align-items:center;justify-content:center;}
  .padLabel{
    flex-direction:column;align-items:center;justify-content:center;
    flex:0 0 34px;gap:6px;padding:0 2px;
    font-family:"Courier New",monospace;font-size:11px;color:#9fe870;
    line-height:1;letter-spacing:0;text-align:center;
    animation:pulse 1.3s ease-in-out infinite;pointer-events:none;
  }
  .padLabel .w{display:block;font-weight:bold;}
  .padLabel .arrow{color:#ffd45e;font-size:14px;}
  .padLabel .arrow.left{}

  #padL{
    width:78px;flex:0 0 78px;
    border:2px solid #6b4a1f;border-radius:10px;
    background:rgba(8,22,16,.6);
    position:relative;touch-action:none;
    align-items:center;justify-content:center;
  }
  #knob{
    position:absolute;left:50%;transform:translate(-50%,-50%);
    width:56px;height:56px;border-radius:12px;
    background:#c9a227;border:3px solid #6b4a1f;pointer-events:none;
    box-shadow:0 0 10px rgba(201,162,39,.4);
  }
  #padL .hint{
    font-family:"Courier New",monospace;font-size:11px;color:#9fe870;
    writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:1px;
    pointer-events:none;line-height:1.2;text-align:center;
    animation:pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  #padR{
    width:104px;flex:0 0 104px;
    border:2px solid #6b4a1f;border-radius:10px;
    background:rgba(8,22,16,.6);
    align-items:center;justify-content:center;
    touch-action:none;user-select:none;cursor:pointer;
  }
  #padR .ring{
    width:84px;height:84px;border-radius:50%;
    border:4px solid #c9a227;background:rgba(201,162,39,.14);
    display:flex;align-items:center;justify-content:center;
    font-family:"Courier New",monospace;font-size:13px;color:#ffd45e;letter-spacing:1px;
    transition:background .08s,transform .08s;
  }
  #padR.hit .ring{background:rgba(201,162,39,.55);transform:scale(.94);}
  #padR{flex-direction:column;gap:4px;}
  .fireHint{
    font-family:"Courier New",monospace;font-size:9px;color:#9fe870;
    text-align:center;line-height:1.3;animation:pulse 1.1s ease-in-out infinite;
    pointer-events:none;
  }
  .fireHint span{display:block;font-size:8px;letter-spacing:1px;}
  #padR.used .fireHint{display:none;}

  #tag{
    text-align:center;color:#7d9a82;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;line-height:1.7;
  }
  #tag b{color:#c9a227;}

  /* ---------- a phone held sideways ---------- */
  @media (orientation:landscape) and (max-height:700px){
    #app{gap:2px;padding:2px;justify-content:flex-start;height:100dvh;max-height:100dvh;overflow:hidden;}
    /* the four-button bar is replaced on phone by the single pause button + top ad */
    #bar{display:none;}
    body.touch #phoneAd{display:flex;}
    #tag{display:none;}
    #promoStrip{display:none;}
    #frame{border-width:2px;border-radius:5px;flex:0 0 auto;}
    #stage{gap:2px;padding:0;align-items:center;width:100%;justify-content:space-between;flex:1 1 auto;min-height:0;overflow:hidden;}
    /* the canvas SIZE is set in pixels by the JS enforcer (enforceCanvasSize),
       which measures the real space and guarantees the whole rectangle is visible.
       CSS only provides fallback bounds in case JS has not run yet. */
    canvas{
      display:block;
      width:auto;height:auto;
      aspect-ratio:960 / 600;
      max-height:calc(100dvh - 34px);
      max-width:calc(100vw - 150px);
    }
    #padL,#padR,.padLabel{align-self:center;}
    #padL{width:44px;flex:0 0 44px;}
    #padR{width:52px;flex:0 0 52px;}
    #padR .ring{width:44px;height:44px;font-size:9px;}
    #knob{width:38px;height:38px;border-radius:10px;}
    .padLabel{flex:0 0 24px;font-size:9px;gap:4px;}
    .padLabel .arrow{font-size:11px;}
  }
  @media (orientation:portrait) and (pointer:coarse){
    #rotate{display:flex !important;}
    #app{display:none !important;}   /* hide the desktop-style game entirely in portrait */
  }
  #over{
    display:none;position:fixed;inset:0;z-index:40;
    background:rgba(4,12,8,.9);
    align-items:center;justify-content:center;padding:16px;overflow:auto;
  }
  #over.show{display:flex;}
  @media (orientation:landscape) and (max-height:700px){
    #nameCard .scoreBig{font-size:28px;margin:4px 0;}
    #nameCard .lbl{margin:8px 0 4px;}
  }
  #over .card{
    display:none;width:100%;max-width:560px;
    background:linear-gradient(180deg,#f4e6c4 0%,#e8d5a8 55%,#d9c08a 100%);
    border:3px solid #8a6a2f;border-radius:10px;
    box-shadow:0 0 0 2px #6b4a1f,0 18px 50px rgba(0,0,0,.7);
    padding:20px;text-align:center;
  }
  #over .card.show{display:block;}
  #over .ttl{font-family:"Courier New",monospace;font-size:24px;color:#7b1f14;letter-spacing:2px;font-weight:bold;}
  #over .sub{font-family:"Courier New",monospace;font-size:12px;color:#5a3d1a;margin-top:6px;}
  #over .scoreBig{font-family:"Courier New",monospace;font-size:38px;color:#7b1f14;margin:10px 0 4px;font-weight:bold;}
  #over .lbl{display:block;font-family:"Courier New",monospace;font-size:11px;color:#6b4a24;letter-spacing:1px;margin:14px 0 6px;}
  #pname{
    width:100%;max-width:300px;padding:10px 12px;
    font-family:"Courier New",monospace;font-size:16px;text-align:center;
    background:#fbf3dd;border:2px solid #8a6a2f;border-radius:6px;color:#3b2a12;
  }
  #pname:focus{outline:none;border-color:#7b1f14;}
  #over .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  #over .note{font-family:"Courier New",monospace;font-size:11px;color:#6b4a24;margin-top:10px;min-height:14px;}
  #over .boards{display:flex;gap:14px;margin-top:12px;text-align:left;flex-wrap:wrap;}
  #over .bcol{flex:1;min-width:200px;}
  #over .bhead{
    font-family:"Courier New",monospace;font-size:11px;color:#2f5b1f;
    letter-spacing:2px;border-bottom:2px solid rgba(120,86,32,.4);padding-bottom:5px;margin-bottom:5px;font-weight:bold;
  }
  #over .bhead span{color:#7b4a12;}
  #over ol{list-style:none;}
  #over ol li{
    display:flex;gap:8px;font-family:"Courier New",monospace;font-size:12px;
    color:#3b2a12;padding:3px 0;border-bottom:1px solid rgba(120,86,32,.28);
  }
  #over ol li .n{color:#7b4a12;width:20px;flex:0 0 20px;font-weight:bold;}
  #over ol li .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #over ol li .sc{color:#7b1f14;font-weight:bold;}
  #over ol li.me{background:rgba(201,162,39,.3);border-radius:3px;}
  #over ol li.loading{color:#8a6a2f;justify-content:center;}
  #over .promoWrap{margin-top:14px;display:flex;flex-direction:column;gap:6px;}
  #boardActions{position:sticky;top:0;z-index:3;background:#e8d5a8;padding:8px 0;border-radius:4px;}
  .btn.primary{border-color:#7b1f14;color:#7b1f14;background:rgba(201,162,39,.35);}
  #over .btn{color:#3b2a12;background:#fbf3dd;border-color:#8a6a2f;}
  #over .btn:hover{background:#f0e4c0;border-color:#7b1f14;}
  #over .btn.primary{background:rgba(201,162,39,.45);color:#7b1f14;border-color:#7b1f14;}
  @media (orientation:landscape) and (max-height:700px){
    #over{padding:6px;align-items:stretch;}
    #over .card{max-width:100%;max-height:100dvh;overflow-y:auto;padding:10px;}
    #over .ttl{font-size:18px;}
    #over .boards{gap:8px;margin-top:6px;}
    #over .bcol{min-width:120px;}
    #over ol li{font-size:10px;padding:2px 0;}
    #boardActions{padding:6px 0;gap:6px;}
    #over .row .btn{flex:1;padding:10px;font-size:12px;}
    .promoBig{padding:8px;}
    .pbFixed{font-size:10px;}
    .pbIntro{font-size:10px;min-height:26px;}
    .pbBtn{padding:9px;font-size:12px;}
  }
  .promoBox{
    display:flex;align-items:center;gap:8px;text-align:left;
    border:2px solid #c9a227;border-radius:6px;padding:6px 10px;
    text-decoration:none;color:#dce8dd;background:rgba(8,22,16,.7);
  }
  .promoBox .tag{
    font-family:"Courier New",monospace;font-size:9px;letter-spacing:2px;
    padding:4px 7px;border-radius:3px;color:#fff;white-space:nowrap;
  }
  .promoBox .txt{flex:1;min-width:0;}
  .promoBox .txt b{display:block;font-family:"Courier New",monospace;font-size:11px;color:#ffd45e;font-weight:bold;line-height:1.25;}
  .promoBox .txt i{font-style:normal;font-size:10px;color:#a9c4ae;}
  .promoBox .go{
    font-family:"Courier New",monospace;font-size:11px;padding:6px 11px;border-radius:3px;
    font-weight:bold;white-space:nowrap;
    animation:btnFlash 2s steps(1) infinite;
  }

  #promoStrip{width:100%;max-width:1040px;display:flex;flex-direction:column;gap:6px;}
  /* the under-game strip never shows on a phone held sideways; the ads appear
     between levels and on the scoreboard instead, where there is room */
  @media (orientation:landscape) and (max-height:700px){
    body.touch #promoStrip{display:none !important;}
  }
  .promoBox{
    animation:slotGlow 10s ease-in-out infinite;
  }
  @keyframes slotGlow{
    0%   {border-color:#c9a227;box-shadow:0 0 8px rgba(201,162,39,.5);}
    50%  {border-color:#ffffff;box-shadow:0 0 14px rgba(255,255,255,.6);}
    100% {border-color:#c9a227;box-shadow:0 0 8px rgba(201,162,39,.5);}
  }
  .plogo{
    width:32px;height:32px;flex:0 0 32px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Courier New",monospace;font-size:14px;color:#fff;font-weight:bold;
  }
  .plogo img{width:100%;height:100%;object-fit:cover;}
  .promoBig{
    background:rgba(20,32,22,.92);border:2px solid #8a6a2f;border-radius:8px;
    padding:10px;text-align:left;
    display:flex;align-items:center;gap:12px;
  }
  .promoBig .pbLeft{flex:1;min-width:0;}
  .promoBig .pbHead{display:flex;align-items:center;gap:10px;}
  .pbTitle{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .pbTitle .tag{
    align-self:flex-start;font-family:"Courier New",monospace;font-size:9px;
    letter-spacing:2px;padding:3px 6px;border-radius:3px;color:#fff;
  }
  .pbTitle b{font-family:"Courier New",monospace;font-size:15px;color:#ffd45e;font-weight:normal;}
  .pbFixed{
    font-size:11px;color:#ffe9a8;margin:6px 0 3px;line-height:1.4;font-weight:bold;
  }
  .pbIntro{
    font-size:11px;color:#cfe0d3;margin:3px 0 0;min-height:0;line-height:1.35;
    transition:opacity .25s;
  }
  .pbBtn{
    flex:0 0 auto;align-self:center;white-space:nowrap;
    text-align:center;text-decoration:none;
    font-family:"Courier New",monospace;font-size:12px;letter-spacing:1px;
    padding:10px 14px;border-radius:6px;font-weight:bold;
    animation:btnFlash 2s steps(1) infinite;
  }
  .pbBtn:hover{filter:brightness(1.2);}
  @keyframes btnFlash{
    0%   {background:#c0261c;color:#ffffff;}
    50%  {background:#111111;color:#ffd45e;}
    100% {background:#c0261c;color:#ffffff;}
  }

  #rotate{
    display:none;position:fixed;inset:0;z-index:50;
    background:#0b1a12;flex-direction:column;
    align-items:center;justify-content:center;gap:12px;text-align:center;padding:14px;
  }
  /* the stacked portrait content: game rectangle, ad, New Game */
  #rotInner{
    display:flex;flex-direction:column;align-items:stretch;gap:10px;
    width:100%;max-width:520px;
  }
  #demo{
    display:block;width:100%;height:auto;aspect-ratio:16 / 10;
    border:3px solid #6b4a1f;border-radius:8px;background:#0a3d5c;
  }
  /* the ad under the rectangle, same flashing style */
  #rotAd{
    display:flex;align-items:center;gap:8px;text-decoration:none;
    border:2px solid #c9a227;border-radius:6px;background:rgba(8,22,16,.8);
    padding:6px 10px;animation:slotGlow 10s ease-in-out infinite;
  }
  #rotAd .pa-logo{width:30px;height:30px;flex:0 0 30px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    font-family:"Courier New",monospace;font-size:12px;color:#fff;font-weight:bold;}
  #rotAd .pa-logo img{width:100%;height:100%;object-fit:cover;}
  #rotAd .pa-txt{flex:1;min-width:0;font-family:"Courier New",monospace;
    font-size:11px;color:#ffd45e;font-weight:bold;line-height:1.3;text-align:left;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  #rotAd .pa-go{flex:0 0 auto;font-family:"Courier New",monospace;font-size:11px;
    padding:6px 11px;border-radius:3px;font-weight:bold;white-space:nowrap;
    animation:btnFlash 2s steps(1) infinite;}
  /* the only button in portrait: New Game */
  #rotNew{
    font-family:"Courier New",monospace;font-size:16px;letter-spacing:2px;font-weight:bold;
    padding:14px;border-radius:8px;cursor:pointer;
    background:rgba(201,162,39,.9);border:2px solid #ffd45e;color:#0b1a12;
  }
  #rotNew:active{transform:scale(.98);}
  /* the "hold horizontally" message, hidden until the player taps */
  #rotMsg{
    display:none;position:fixed;inset:0;z-index:51;
    flex-direction:column;align-items:center;justify-content:center;
    background:rgba(4,12,8,.94);text-align:center;padding:24px;gap:8px;
  }
  #rotMsg.show{display:flex;}
  #rotMsg .big{
    font-family:"Courier New",monospace;font-size:26px;letter-spacing:2px;font-weight:bold;
    animation:rotmsg 1.2s steps(1) infinite;text-shadow:0 2px 8px rgba(0,0,0,.9);
  }
  @keyframes rotmsg{0%{color:#e2483a;}50%{color:#ffd45e;}100%{color:#e2483a;}}
  #rotMsg .sub{color:#fff;font-size:14px;margin-top:8px;}
</style>
</head>
<body>
<div id="app">

  <a id="phoneAd" target="_blank" rel="noopener"></a>

  <div id="bar">
    <span class="brand">CROC ARCHER</span>
    <button class="btn" id="bNew" title="Start again from stage one"><span class="bl">NEW GAME</span></button>
    <button class="btn" id="bPause" title="Pause"><span class="bl">PAUSE</span></button>
    <button class="btn" id="bAbort" title="Give up this run"><span class="bl">ABORT</span></button>
    <button class="btn on" id="bSound" title="Game sound">
      <svg id="sndIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z"/><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <span id="sndLabel" class="bl">SOUND ON</span>
    </button>
  </div>

  <div id="stage">
    <div id="padL"><div id="knob"></div></div>
    <div id="labL" class="padLabel"><span class="arrow left">&#9664;</span><span class="w">MOVE</span><span class="w">THIS</span><span class="w">TO</span><span class="w">AIM</span></div>
    <div id="frame"><canvas id="game" width="960" height="600"></canvas></div>

  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02);
}

function rnd(a,b){ return a + Math.random() * (b - a); }
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function realLeft(){ return queue.filter(q => !q.decoy).length + targets.filter(t => t.alive && !t.decoy).length; }
function burst(x, y, c, n, spd, kind){
  for (let i = 0; i < n; i++){
    const a = Math.random() * 6.283, s = rnd(0.4, 1) * spd;
    bits.push({ x:x, y:y, vx:Math.cos(a) * s, vy:Math.sin(a) * s, life:rnd(24,52), max:52, c:c, k:kind || "dot", rot:Math.random() * 6.28, vr:rnd(-0.2,0.2), sz:rnd(2,5) });

}

    else deco.push({ x:rnd(0,W), y:rnd(0,H), s:rnd(1.5,5), v:rnd(0.3,1.1), w:rnd(0.01,0.04), p:Math.random() * 6.28 });
  }
  winDeco = false;
  clockMax = (L.secs || 0) * 60;
  clock = clockMax;
  noteData = { scoreAtStart: score };
  flashMsg = null; paused = false; dryTimer = 60;
  state = "play";
}

function spawn(){
  const L = LEVELS[levelIndex];
  if (!queue.length) return;

  if (L.mode === "rise" && L.line){
    /* a rank of them abreast, all at the same height, like the old machine */
    const n = Math.min(L.line, queue.length);
    const left = 300, right = W - 70;
    const step = n > 1 ? (right - left) / (n - 1) : 0;
    const rank = rnd(0.95, 1.25);      /* one speed for the whole rank so the line holds */
    const ph = Math.random() * 6.28;
    for (let i = 0; i < n; i++){
      const o = queue.shift();
      o.alive = true; o.maxHp = o.hp; o.flash = 0; o.uid = ++uid;
      o.phase = ph;
      o.sway = 14; o.swaySpd = 0.016;
      o.x = left + step * i + rnd(-6, 6); o.homeX = o.x;
      o.wave = i * 0.62;                 /* the ripple that runs down the line */
      o.baseY = H + 70; o.y = o.baseY;
      o.vx = 0;
      o.vy = -(o.decoy ? rank * 1.65 : rank);   /* the egg balloons pull clear of the flock */
      targets.push(o); spawned++;
    }
    return;
  }

  if (L.mode === "float"){
    /* every bag gets its own lane and its own steady pace. nothing appears in mid water:
       the near side rises up from below, the right hand side sinks down from above */
    const o = queue.shift();
    o.alive = true; o.maxHp = o.hp; o.flash = 0; o.phase = Math.random() * 6.28; o.uid = ++uid;
    const sinking = (spawned % 5) >= 3;
    o.sink = sinking;
    o.homeX = sinking ? rnd(628, 924) : rnd(262, 596);
    o.x = o.homeX;
    o.y = sinking ? -48 : H + 48;
    o.vy = sinking ? o.speed : -o.speed;
    o.sway = rnd(0, 13); o.swaySpd = rnd(0.007, 0.016);
    targets.push(o); spawned++;
    return;
  }

  if (L.mode === "bull"){
    const o = queue.shift();
    o.alive = true; o.maxHp = o.hp; o.flash = 0; o.phase = 0; o.uid = ++uid;
    o.x = 892; o.y = 320; o.vx = 0; o.vy = o.speed;
    targets.push(o); spawned++;
    return;
  }

  const o = queue.shift();
  o.alive = true; o.maxHp = o.hp; o.flash = 0; o.phase = Math.random() * 6.28; o.uid = ++uid;
  if (L.mode === "rise"){
    o.x = rnd(300, W - 70); o.homeX = o.x; o.y = H + 70; o.vx = 0; o.vy = -o.speed;
  } else {
    o.x = W + 80; o.y = rnd(110, 505);
    o.homeY = o.y; o.vx = -o.speed; o.vy = 0;
  }
  if (o.shoots) o.fire = rnd(o.shoots[0], o.shoots[1]);
  if (o.type === "octo"){ o.hold = rnd(60,150); o.jet = 0; o.jvy = 0; o.settled = true; }
  targets.push(o); spawned++;
}

function finishLevel(){
  const L = LEVELS[levelIndex];
  const acc = shotsFired ? Math.round((shotsHit / shotsFired) * 100) : 0;
  const saved = arrows * 50;
  score += saved;
  noteData = { level:L.n, title:L.title, rescue:!!L.rescue, timed: clockMax > 0, held: Math.round(clockMax/60), hits:killed, acc:acc, through: L.mode === "left" ? escaped : 0,
               left:arrows, saved:saved, total:score,
               next: levelIndex + 1 < LEVELS.length ? LEVELS[levelIndex + 1] : null,
               scoreAtStart: noteData ? noteData.scoreAtStart : 0 };
  sfx.win();
  promoIdx = (promoIdx + 1) % PROMOS.length;
  paintStrip();
  state = levelIndex + 1 < LEVELS.length ? "note" : "win";
  noteShownAt = time;
  if (state === "win") gloryTimer = 15 * 60;
}

function advance(){ if (levelIndex + 1 < LEVELS.length) startLevel(levelIndex + 1); else state = "win"; }

/* ============================================================
   SHOOTING - dead straight, no arc, no power
   ============================================================ */
function fire(){
  if (arrows <= 0 || croc.hp <= 0 || croc.cool > 0 || intro > 0) return;
  const sp = croc.env === "sky" ? 15 : 11.5;
  shafts.push({ x: croc.x + 34, y: bowY(), vx: sp, life: 240, pierce: LEVELS[levelIndex].mode === "rise" || LEVELS[levelIndex].mode === "float", hitIds: [] });
  arrows--; shotsFired++; croc.cool = COOL; croc.recoil = 1;
  sfx.twang();
}

/* ============================================================
   UPDATE
   ============================================================ */
function update(dt){
  time += dt;
  updateCursor();
  if (state === "loading"){
    loadTimer -= dt;
    if (loadTimer <= 0) advance();
    return;
  }
  if (state === "win" && gloryTimer > 0){
    gloryTimer -= dt;
    if (gloryTimer <= 0) endRun("CLEARED");
  }
  if (shake > 0) shake = Math.max(0, shake - dt * 0.9);
  if (state !== "play" || paused) return;

  const L = LEVELS[levelIndex];
  const sky = L.env === "sky";

  if (inputMode === "touch"){
    /* the aim pad sets a target height; ease toward it */
    croc.y += (Math.max(croc.minY, Math.min(croc.maxY, aimY)) - croc.y) * Math.min(1, 0.45 * dt);
  } else if (inputMode === "keys"){
    /* direct joystick feel: hold to move, release to stop and hold position */
    const sp = 6.5 * dt;
    if (keys["KeyW"] || keys["ArrowUp"])   croc.y -= sp;
    if (keys["KeyS"] || keys["ArrowDown"]) croc.y += sp;
    croc.y = Math.max(croc.minY, Math.min(croc.maxY, croc.y));
  } else {
    /* mouse: the bow sits on the cursor */
    const want = mouse.y - BOW_DY;
    croc.y += (Math.max(croc.minY, Math.min(croc.maxY, want)) - croc.y) * Math.min(1, 0.45 * dt);
  }

  if (croc.cool > 0)   croc.cool   = Math.max(0, croc.cool - dt);
  if (score > hiScore) hiScore = score;
  if (score > dayBest) dayBest = score;
  if (croc.recoil > 0) croc.recoil = Math.max(0, croc.recoil - 0.09 * dt);
  if (croc.hurt > 0)   croc.hurt   = Math.max(0, croc.hurt - 0.04 * dt);
  if (croc.invuln > 0) croc.invuln = Math.max(0, croc.invuln - dt);

  /* background drift */
  for (const d of deco){
    if (sky){ d.x += d.v * dt; if (d.x > W + 90) d.x = -90; }
    else { d.y -= d.v * dt; d.x += Math.sin(time * d.w + d.p) * 0.4 * dt; if (d.y < -10){ d.y = H + 10; d.x = rnd(0, W); } }
  }

  if (intro > 0){ intro -= dt; return; }

  if (clockMax > 0 && clock > 0) clock = Math.max(0, clock - dt);

  /* the marquee keeps feeding */
  if (queue.length && !(clockMax > 0 && clock <= 0)){
    spawnTimer -= dt;
    if (spawnTimer <= 0){ spawn(); const g = L.gap || [60,60]; spawnTimer = rnd(g[0], g[1]); }
  }

  /* targets */
  for (let i = targets.length - 1; i >= 0; i--){
    const t = targets[i];
    if (!t.alive){ targets.splice(i, 1); continue; }
    if (t.flash > 0) t.flash -= dt;

    if (L.mode === "rise"){
      if (t.baseY === undefined) t.baseY = t.y;
      t.baseY += t.vy * dt;
      t.y = t.baseY + (t.wave !== undefined ? Math.sin(time * 0.021 + t.wave) * 11 : 0);
      t.x = t.homeX + Math.sin(time * t.swaySpd + t.phase) * t.sway;
      if (t.baseY < -80){
        if (L.cycle){ t.baseY = H + 70; }    /* the survivors swing round and come again */
        else { targets.splice(i, 1); if (!t.decoy) miss(t); continue; }
      }
    }
    else if (L.mode === "float"){
      t.y += t.vy * dt;
      t.x = t.homeX + Math.sin(time * t.swaySpd + t.phase) * t.sway;
      if (t.sink){ if (t.y > H + 60) t.y = -60; }
      else { if (t.y < -60) t.y = H + 60; }
    }
    else if (L.mode === "bull"){
      t.y += t.vy * dt;
      if (t.y < 104){ t.y = 104; t.vy = Math.abs(t.vy); }
      if (t.y > 540){ t.y = 540; t.vy = -Math.abs(t.vy); }
    }
    else {
      t.x += t.vx * dt;
      if (t.sway) t.y = t.homeY + Math.sin(time * t.swaySpd + t.phase) * t.sway;
      if (t.hunt && t.x < 470){
        /* it turns onto your line as it closes */
        const dy = (croc.y + MID_DY) - t.y;
        const step = Math.min(Math.abs(dy), t.hunt * dt) * (dy < 0 ? -1 : 1);
        t.y += step; t.homeY += step;
      }
      if (t.type === "octo"){
        if (t.jet > 0){ t.jet -= dt; t.homeY += t.jvy * dt; }
        else {
          const incoming = shafts.some(sh => !sh.stuck && sh.x < t.x);
          t.hold -= dt;
          if (t.hold <= 0 && !incoming){ t.jet = 24; t.hold = rnd(110,200); t.jvy = (Math.random() < 0.5 ? -1 : 1) * rnd(2.6,5.4); }
        }
        t.homeY = Math.max(122, Math.min(498, t.homeY));
        t.y = t.homeY;
        t.settled = t.jet <= 0;
      }
      if (t.shoots){
        t.fire -= dt;
        if (t.fire <= 0 && t.x < W - 40){
          t.fire = rnd(t.shoots[0], t.shoots[1]);
          if (t.type === "ray"){
            hostile.push({ type:"barb", x:t.x - 26, y:t.y + 4, vx:-4.4, r:7, life:360 });
            tone(480, 0.07, "sawtooth", 0.05, 180);
          } else {
            hostile.push({ type:"torp", x:t.x - 52, y:t.y + 6, vx:-2.7, r:11, life:460 });
            tone(220, 0.14, "sine", 0.05, 120);
          }
        }
      }
      /* it reached the archer */
      if (t.bite && Math.abs(t.x - croc.x) < t.r * 0.7 + 10 && Math.abs(t.y - (croc.y + MID_DY)) < t.r * 0.55 + 22){
        if (croc.invuln <= 0) damage();
        targets.splice(i, 1); miss(t); continue;
      }
      if (t.x < -90){ targets.splice(i, 1); if (!t.decoy) miss(t); continue; }
    }
  }

  /* arrows */
  for (let i = shafts.length - 1; i >= 0; i--){
    const s = shafts[i];
    s.life -= dt;
    if (s.stuck){
      if (!s.host || !s.host.alive || targets.indexOf(s.host) < 0){ shafts.splice(i, 1); continue; }
      s.x = s.host.x + s.hx; s.y = s.host.y + s.hy;
      continue;
    }
    s.x += s.vx * dt;
    if (!sky && Math.random() < 0.3) bits.push({ x:s.x - 14, y:s.y, vx:rnd(-0.2,0.2), vy:-rnd(0.3,0.9), life:26, max:26, c:"rgba(210,240,255,0.55)", k:"bub", sz:rnd(1,2.6), rot:0, vr:0 });

    let handled = false, remove = false;
    for (const t of targets){
      if (!t.alive) continue;
      if (s.pierce && s.hitIds.indexOf(t.uid) >= 0) continue;
      const rx = t.type === "octo" ? 22 : t.r;
      const ry = t.type === "octo" ? 36 : t.r * 0.95;
      if (Math.abs(s.x - t.x) < rx && Math.abs(s.y - t.y) < ry){
        remove = hit(t, s);
        if (s.pierce){ s.hitIds.push(t.uid); remove = false; }
        handled = true; break;
      }
    }
    if (handled){ if (remove) shafts.splice(i, 1); continue; }

    for (let j = hostile.length - 1; j >= 0; j--){
      const p = hostile[j];
      if (Math.abs(s.x - p.x) < p.r + 10 && Math.abs(s.y - p.y) < p.r + 8){
        burst(p.x, p.y, p.type === "torp" ? "#ffb43b" : "#ffe27a", 16, 3.2, "dot");
        hostile.splice(j, 1); score += 60; countHit(s);
        flash(p.type === "torp" ? "TORPEDO SPLIT  +60" : "SHOT DOWN  +60", "#ffd45e");
        sfx.boom(); shake = 6; handled = true; break;
      }
    }
    if (handled){ shafts.splice(i, 1); continue; }

    if (s.x > W + 40 || s.life <= 0){ shafts.splice(i, 1); sfx.miss(); }
  }

  /* incoming fire */
  for (let i = hostile.length - 1; i >= 0; i--){
    const p = hostile[i];
    p.life -= dt; p.x += p.vx * dt;
    if (p.type === "torp" && Math.random() < 0.35)
      bits.push({ x:p.x + 14, y:p.y, vx:rnd(-0.3,0.3), vy:-rnd(0.2,0.7), life:24, max:24, c:"rgba(220,245,255,0.5)", k:"bub", sz:rnd(1,2.4), rot:0, vr:0 });
    if (Math.abs(p.x - croc.x) < 20 && Math.abs(p.y - (croc.y + MID_DY)) < 24){ hostile.splice(i, 1); damage(); continue; }
    if (p.life <= 0 || p.x < -40) hostile.splice(i, 1);
  }

  /* particles */
  for (let i = bits.length - 1; i >= 0; i--){
    const b = bits[i];
    b.life -= dt; b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.k === "bub") b.vy -= 0.02 * dt;
    else if (b.k === "feather"){ b.vy += 0.05 * dt; b.vx *= 0.99; b.rot += b.vr * dt; }
    else if (b.k === "turtle"){ b.vx += 0.012 * dt; b.vy -= 0.003 * dt; b.rot = Math.sin(b.life * 0.09) * 0.16;
      if (Math.random() < 0.14) bits.push({ x:b.x-14, y:b.y, vx:0, vy:-0.5, life:26, max:26, c:"rgba(220,245,255,0.5)", k:"bub", sz:rnd(1,2.4), rot:0, vr:0 }); }
    else if (b.k === "plastic"){ b.vy += 0.006 * dt; b.vx *= 0.985; b.rot += b.vr * dt; }
    else b.vy += (sky ? 0.14 : 0.05) * dt;
    if (b.life <= 0) bits.splice(i, 1);
  }

  if (flashMsg){ flashMsg.t -= dt; if (flashMsg.t <= 0) flashMsg = null; }

  /* two ways to lose. they touch you, or the quiver runs dry with the wave still coming */
  if (croc.hp <= 0){ state = "dead"; gloryTimer = 0; endRun("LOST"); return; }
  if (clockMax > 0){
    /* a timed stage is over when the clock runs out and the last of them has gone by */
    if (clock <= 0 && targets.filter(t => t.alive).length === 0){ finishLevel(); return; }
  }
  else if (queue.length === 0 && realLeft() === 0){ finishLevel(); return; }
  /* an empty quiver only finishes you on the stages where the targets keep coming back.
     out in the channel you can still clear the stage by staying out of their way */
  if (L.dryFatal && arrows === 0 && shafts.filter(s => !s.stuck).length === 0){
    dryTimer -= dt;
    if (dryTimer <= 0){ state = "dead"; gloryTimer = 0; endRun("LOST"); }
  } else dryTimer = 60;
}

function miss(t){
  escaped++;
  sfx.flee();
  if (LEVELS[levelIndex].mode === "rise"){
    /* balloons and bags drift back round, so a rescue can always be finished */
    t.hp = t.maxHp; t.alive = true; t.flash = 0;
    queue.push(t);
  } else if (clockMax <= 0){
    /* anything that gets past the archer is into the swamp for good, and it costs you */
    score = Math.max(0, score - 50);
  }
}

function damage(){
  if (croc.invuln > 0 || croc.hp <= 0) return;
  croc.hp = 0; croc.hurt = 1; croc.invuln = 999; shake = 16;
  sfx.hurt();
  burst(croc.x + 6, croc.y + MID_DY, "#ff6b4a", 30, 3.6, "dot");
  burst(croc.x + 6, croc.y + MID_DY, "#ffd45e", 18, 2.6, "dot");
}

function hitBoard(t, s){
  const dy = s.y - t.y;
  const d = Math.abs(dy);
  t.flash = 14;

  /* the shaft stays where it struck, so you can read how early or late you were */
  s.stuck = true; s.host = t; s.hx = -26; s.hy = dy; s.life = 99999;

  if (d < 12){
    countHit(s); t.hp--; killed++; score += t.points;
    t.vy = (t.vy < 0 ? -1 : 1) * Math.abs(t.vy) * 1.3;   /* it runs quicker after every one */
    burst(t.x, t.y, "#ffd45e", 26, 3.4, "dot");
    if (t.hp <= 0){
      burst(t.x, t.y, "#fff", 34, 4.4, "dot");
      flash("BULLSEYE - RANGE CLEARED", "#ffd45e");
      t.alive = false;
    } else {
      flash("BULLSEYE   +" + t.points + "   " + t.hp + " TO GO", "#ffd45e");
    }
    sfx.win(); shake = 9;
    return false;
  }

  const pts = d < 26 ? 60 : d < 40 ? 30 : 10;
  score += pts;
  flash((dy < 0 ? "TOO EARLY" : "TOO LATE") + "   " + (d < 26 ? "INNER" : d < 40 ? "MIDDLE" : "OUTER") + " RING   +" + pts, "#8fb7c9");
  burst(s.x, s.y, "#f4f4e8", 10, 1.8, "dot");
  sfx.thud();
  return false;
}

function countHit(s){ if (s && !s.counted){ shotsHit++; s.counted = true; } }

function hit(t, s){
  if (t.type === "board") return hitBoard(t, s);
  /* the dart board only counts on the gold */
  if (t.type === "octo"){
    const dy = Math.abs(s.y - t.y);
    t.flash = 12;
    if (dy < 9){
      countHit(s); t.alive = false; killed++; score += t.points;
      flash("BULLSEYE   +" + t.points, "#ffd45e");
      burst(t.x, t.y, "#ffd45e", 28, 3.6, "dot");
      burst(t.x, t.y, "rgba(220,245,255,0.7)", 18, 2.4, "bub");
      sfx.win(); shake = 8;
      return true;
    }
    const inner = dy < 20;
    score += inner ? 50 : 15;
    flash(inner ? "INNER RING   +50" : "OUTER RING   +15", "#8fb7c9");
    burst(s.x, s.y, "#f4f4e8", 12, 2.2, "dot");
    t.jet = 22; t.hold = rnd(110,200); t.jvy = (Math.random() < 0.5 ? -1 : 1) * rnd(3.2,6.0);
    sfx.thud();
    return true;
  }

  t.hp--; t.flash = 12; countHit(s);

  if (t.decoy){
    burst(t.x, t.y, "#ffe27a", 20, 3.2, "dot");
    burst(t.x, t.y + 18, "#fff6d0", 12, 2.2, "dot");
    score += t.points;
    flash("EGG BROKEN   " + t.points, "#ff7a5c");
    sfx.bad(); t.alive = false; return true;
  }

  if (t.hp > 0){
    burst(t.x, t.y, "#cfe9ff", 10, 2.2, "dot");
    s.stuck = true; s.host = t; s.hx = s.x - t.x; s.hy = s.y - t.y; s.life = 999;
    sfx.thud(); return false;
  }

  t.alive = false; killed++; score += t.points;
  flash("+" + t.points, "#9fe870");

  switch (t.type){
    case "bag":
      burst(t.x, t.y, "rgba(220,245,255,0.8)", 14, 2.0, "bub");
      for (let i = 0; i < 9; i++)
        bits.push({ x:t.x + rnd(-24,24), y:t.y + rnd(-30,30), vx:rnd(-1.1,1.1), vy:rnd(0.3,1.3),
                    life:rnd(70,120), max:120, c:"rgba(230,248,255,0.75)", k:"plastic",
                    sz:rnd(5,11), rot:Math.random()*6.28, vr:rnd(-0.09,0.09) });
      bits.push({ x:t.x, y:t.y, vx:rnd(1.3,2.0), vy:-rnd(0.2,0.6), life:170, max:170,
                  c:"#3f9e5a", k:"turtle", sz:1, rot:0, vr:0 });
      flash("TURTLE FREE   +" + t.points, "#7ee06a");
      sfx.win(); break;
    case "chickenBalloon":
      burst(t.x, t.y, "#e23b2e", 18, 3.4, "dot");
      for (let i = 0; i < 10; i++) bits.push({ x:t.x, y:t.y + 34, vx:rnd(-1.6,1.6), vy:rnd(-2.2,0.4), life:rnd(50,90), max:90, c:"#ff5a4a", k:"feather", sz:rnd(4,8), rot:Math.random() * 6.28, vr:rnd(-0.16,0.16) });
      sfx.pop(); break;
    case "shark": case "hammer":
      burst(t.x, t.y, "#8fa6b5", 20, 3, "dot"); burst(t.x, t.y, "rgba(220,245,255,0.7)", 14, 2, "bub"); sfx.pop(); break;
    case "whale":
      burst(t.x, t.y, WHALE_SKINS[(t.skin || 0) % WHALE_SKINS.length].back, 26, 3.2, "dot"); burst(t.x, t.y, "rgba(220,245,255,0.7)", 20, 2.4, "bub"); sfx.thud(); shake = 8; break;
    case "hunter":
      burst(t.x, t.y, "#c8823c", 16, 2.8, "dot"); sfx.pop(); break;
    case "ray":
      burst(t.x, t.y, "#4a5f80", 24, 3.2, "dot");
      burst(t.x, t.y, "rgba(220,245,255,0.7)", 16, 2.2, "bub");
      sfx.pop(); shake = 6; break;
    case "sub": case "bomber":
      burst(t.x, t.y, "#ffb43b", 30, 4, "dot"); burst(t.x, t.y, "rgba(220,245,255,0.7)", 22, 2.6, "bub"); sfx.boom(); shake = 10; break;
    default: burst(t.x, t.y, "#ffffff", 14, 2.6, "dot"); sfx.pop();
  }
  return true;
}

/* ============================================================
   BACKGROUNDS
   ============================================================ */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, 460);
  g.addColorStop(0, "#2f6fb0"); g.addColorStop(0.45, "#7fb6dd"); g.addColorStop(1, "#d4e9f2");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 462);

  ctx.save(); ctx.globalAlpha = 0.9;
  const sg = ctx.createRadialGradient(810, 92, 8, 810, 92, 70);
  sg.addColorStop(0, "#fff7cf"); sg.addColorStop(0.5, "rgba(255,230,140,0.55)"); sg.addColorStop(1, "rgba(255,230,140,0)");
  ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(810, 92, 70, 0, 6.29); ctx.fill();

/* ============================================================
   THE ARCHER
   ============================================================ */
function drawCroc(){
  ctx.save();
  ctx.translate(croc.x, croc.y);
  ctx.scale(SC, SC);
  if (croc.hp <= 0) ctx.rotate(Math.min(1.4, (999 - croc.invuln) * 0.02));

  const green = croc.hurt > 0.4 ? "#8fd47a" : "#4f9e46";
  const dark = "#2f6c30", belly = "#d9e07a";
  const swim = croc.env === "water";

  ctx.fillStyle = "rgba(0,0,0,0.22)";
  ctx.beginPath(); ctx.ellipse(4, 4, 40, 9, 0, 0, 6.29); ctx.fill();

  /* tail */
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.moveTo(-6,-46);
  ctx.quadraticCurveTo(-58,-46 + Math.sin(time * 0.06) * 6, -96, -14 + Math.sin(time * 0.06) * 14);
  ctx.quadraticCurveTo(-58,-30,-8,-22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#255a27";
  for (let i = 0; i < 5; i++){
    const t2 = i / 5, tx = -14 - t2 * 66, ty = -44 + t2 * 20 + Math.sin(time * 0.06) * t2 * 9;
    ctx.beginPath(); ctx.moveTo(tx,ty); ctx.lineTo(tx-7,ty-9); ctx.lineTo(tx-13,ty); ctx.closePath(); ctx.fill();
  }

  /* legs */
  ctx.fillStyle = dark;
  const kick = swim ? Math.sin(time * 0.12) * 5 : 0;
  ctx.fillRect(-14, -30, 13, 30); ctx.fillRect(6, -30, 13, 30);
  ctx.fillStyle = "#d9c98a";
  ctx.beginPath(); ctx.ellipse(-8, kick, 13, 6, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, -kick, 13, 6, 0, 0, 6.29); ctx.fill();

  /* body */
  ctx.fillStyle = green; ctx.beginPath(); ctx.ellipse(0,-56,25,32,0,0,6.29); ctx.fill();
  ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(6,-52,16,25,0,0,6.29); ctx.fill();
  ctx.fillStyle = dark;
  for (let i = 0; i < 4; i++){ const y = -80 + i * 15; ctx.beginPath(); ctx.moveTo(-22,y); ctx.lineTo(-30,y+4); ctx.lineTo(-21,y+10); ctx.closePath(); ctx.fill(); }

  /* quiver */
  ctx.save(); ctx.translate(-22,-74); ctx.rotate(-0.35);
  ctx.fillStyle = "#6b4a24"; ctx.fillRect(-9,-6,18,34);
  ctx.fillStyle = "#3f2a12"; ctx.fillRect(-9,-6,18,5);
  ctx.strokeStyle = "#c9a227"; ctx.lineWidth = 2;
  for (let i = 0; i < Math.min(5, arrows); i++){ ctx.beginPath(); ctx.moveTo(-6+i*3,-6); ctx.lineTo(-8+i*3,-22); ctx.stroke(); }
  ctx.restore();

  /* head */
  const hx = 14, hy = -96;
  ctx.fillStyle = green;
  ctx.beginPath(); ctx.ellipse(hx,hy,21,16,0,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.moveTo(hx+6,hy-8); ctx.lineTo(hx+52,hy-3); ctx.lineTo(hx+52,hy+10); ctx.lineTo(hx+6,hy+12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = belly;
  ctx.beginPath(); ctx.moveTo(hx+10,hy+6); ctx.lineTo(hx+51,hy+4); ctx.lineTo(hx+51,hy+10); ctx.lineTo(hx+10,hy+12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 7; i++){ const tx = hx+14+i*5.5; ctx.beginPath(); ctx.moveTo(tx,hy+4); ctx.lineTo(tx+3,hy+4); ctx.lineTo(tx+1.5,hy+9); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle = green; ctx.beginPath(); ctx.ellipse(hx+4,hy-13,8,8,0,0,6.29); ctx.fill();
  ctx.fillStyle = "#fff9d8"; ctx.beginPath(); ctx.arc(hx+5,hy-13,5.4,0,6.29); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.ellipse(hx+7,hy-13,1.9,4.4,0,0,6.29); ctx.fill();
  ctx.fillStyle = "#255a27"; ctx.beginPath(); ctx.arc(hx+47,hy-1,2.4,0,6.29); ctx.fill();
  ctx.fillStyle = "#b3352c"; ctx.fillRect(hx-18,hy-20,36,6);
  ctx.beginPath(); ctx.moveTo(hx-18,hy-18); ctx.lineTo(hx-34,hy-8); ctx.lineTo(hx-32,hy-20); ctx.closePath(); ctx.fill();

  /* bow, always level. it redraws as the archer reloads */
  const ready = 1 - croc.cool / COOL;
  const pull = 15 * ready;
  ctx.save(); ctx.translate(34, -74);
  ctx.strokeStyle = "#8a5a24"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.arc(-6,0,30,-1.25,1.25); ctx.stroke();
  ctx.strokeStyle = "#c9a227"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-6,0,30,-1.25,1.25); ctx.stroke();
  const t1x = -6 + Math.cos(-1.25)*30, t1y = Math.sin(-1.25)*30;
  const t2x = -6 + Math.cos(1.25)*30,  t2y = Math.sin(1.25)*30;
  ctx.strokeStyle = "rgba(255,255,255,0.9)"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(t1x,t1y); ctx.lineTo(-8-pull,0); ctx.lineTo(t2x,t2y); ctx.stroke();
  if (arrows > 0 && ready > 0.15){
    ctx.globalAlpha = Math.min(1, ready * 1.4);
    ctx.strokeStyle = "#e8d9b0"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-8-pull,0); ctx.lineTo(30,0); ctx.stroke();
    ctx.fillStyle = "#d8dee3";
    ctx.beginPath(); ctx.moveTo(38,0); ctx.lineTo(28,-4.5); ctx.lineTo(28,4.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#c9382c";
    ctx.beginPath(); ctx.moveTo(-8-pull,0); ctx.lineTo(-1-pull,-5); ctx.lineTo(1-pull,0); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  /* arms */
  ctx.strokeStyle = green; ctx.lineWidth = 9; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(8,-70); ctx.lineTo(30,-74); ctx.stroke();
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.moveTo(2,-70); ctx.lineTo(22 - pull,-74); ctx.stroke();
  ctx.lineCap = "butt";

  ctx.restore();
}

function drawWhale(t){
  const sk = WHALE_SKINS[(t.skin || 0) % WHALE_SKINS.length];
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(-1, 1);   /* face left, moving right-to-left */
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 20; }
  const wag = Math.sin(time * 0.05 + t.phase) * 0.16;

  /* the spout, a puff of water from the blowhole, on a slow cycle */
  const blow = (time * 1.4 + t.phase * 40) % 150;
  if (blow < 42){
    const p = blow / 42;
    ctx.save();
    ctx.globalAlpha = (1 - p) * 0.7;
    ctx.fillStyle = "rgba(220,240,255,0.9)";
    for (let i = 0; i < 5; i++){
      const a2 = -1.2 + i * 0.28;
      const rr = 6 + p * 20;
      const sx = 8 + Math.cos(a2) * rr * 0.5;
      const sy = -34 - p * 30 + Math.sin(a2) * rr;
      ctx.beginPath(); ctx.arc(sx, sy, 3 + (1 - p) * 3, 0, 6.29); ctx.fill();
    }
    ctx.restore();
  }

  /* the tail flukes, wide and notched, swinging gently */
  ctx.save(); ctx.translate(-52, 2); ctx.rotate(wag);
  ctx.fillStyle = sk.fin;
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.quadraticCurveTo(-10, -4, -26, -20);
  ctx.quadraticCurveTo(-18, -18, -14, -8);   /* upper fluke */
  ctx.quadraticCurveTo(-10, -2, -6, 0);
  ctx.quadraticCurveTo(-10, 2, -14, 8);
  ctx.quadraticCurveTo(-18, 18, -26, 20);    /* lower fluke */
  ctx.quadraticCurveTo(-10, 4, 8, 0);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  /* the body, a fuller teardrop that tapers to the tail */
  ctx.fillStyle = sk.back;
  ctx.beginPath();
  ctx.moveTo(54, 0);
  ctx.quadraticCurveTo(44, -22, 10, -24);
  ctx.quadraticCurveTo(-30, -24, -50, -6);   /* back down to the tail stock */
  ctx.quadraticCurveTo(-40, 0, -50, 6);
  ctx.quadraticCurveTo(-30, 24, 10, 24);
  ctx.quadraticCurveTo(44, 22, 54, 0);
  ctx.closePath(); ctx.fill();

  /* the pale underside */
  ctx.fillStyle = sk.belly;
  ctx.beginPath();
  ctx.moveTo(48, 8);
  ctx.quadraticCurveTo(16, 26, -20, 20);
  ctx.quadraticCurveTo(10, 22, 48, 8);
  ctx.closePath(); ctx.fill();

  /* the throat grooves */
  ctx.strokeStyle = "rgba(0,0,0,0.14)"; ctx.lineWidth = 1.6;
  for (let i = 0; i < 5; i++){ ctx.beginPath(); ctx.moveTo(30 + i*7, 12); ctx.lineTo(26 + i*7, 22); ctx.stroke(); }

  /* the side flipper */
  ctx.fillStyle = sk.fin;
  ctx.beginPath();
  ctx.moveTo(14, 14);
  ctx.quadraticCurveTo(2, 34, -16, 30);
  ctx.quadraticCurveTo(-2, 22, 8, 14);
  ctx.closePath(); ctx.fill();

  /* a small dorsal fin */
  ctx.beginPath();
  ctx.moveTo(-8, -22); ctx.quadraticCurveTo(-16, -34, -24, -22);
  ctx.closePath(); ctx.fill();

  /* the blowhole */
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.beginPath(); ctx.ellipse(8, -24, 3, 2, 0, 0, 6.29); ctx.fill();

  /* mottled skin */
  ctx.fillStyle = "rgba(255,255,255,0.14)";
  for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.ellipse(2 + i*12, -10 + (i%2)*8, 4, 2.6, 0.3, 0, 6.29); ctx.fill(); }

  /* the eye and a friendly mouth line */
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(42, -4, 3.4, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(43, -4, 1.9, 0, 6.29); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.3)"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(50, 6); ctx.quadraticCurveTo(40, 12, 30, 10); ctx.stroke();

  ctx.restore();
  pips(t);
}

function drawBoard(t){
  /* the rope and pulleys it runs on */
  ctx.strokeStyle = "rgba(60,44,20,0.85)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(t.x, 60); ctx.lineTo(t.x, H); ctx.stroke();
  ctx.fillStyle = "#6b4a24";
  ctx.beginPath(); ctx.arc(t.x, 62, 12, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(t.x, H - 24, 12, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#c9a227";
  ctx.beginPath(); ctx.arc(t.x, 62, 4, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc(t.x, H - 24, 4, 0, 6.29); ctx.fill();

  ctx.save();
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 22; }
  /* the bracket that carries it */
  ctx.fillStyle = "#4a3520";
  ctx.fillRect(t.x - 7, t.y - 66, 14, 132);
  /* the rings, black then red then yellow then the gold */
  ctx.fillStyle = "#1b1b1b"; ctx.beginPath(); ctx.arc(t.x, t.y, 54, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#f2ecd8"; ctx.beginPath(); ctx.arc(t.x, t.y, 47, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#1b1b1b"; ctx.beginPath(); ctx.arc(t.x, t.y, 40, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#c0261c"; ctx.beginPath(); ctx.arc(t.x, t.y, 26, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#ffd45e"; ctx.beginPath(); ctx.arc(t.x, t.y, 12, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#7b1f14"; ctx.beginPath(); ctx.arc(t.x, t.y, 4, 0, 6.29); ctx.fill();
  /* the gold band reads across the field so you can time the run */
  ctx.strokeStyle = "rgba(255,212,94,0.5)"; ctx.lineWidth = 2;
  ctx.setLineDash([6,8]);
  ctx.beginPath(); ctx.moveTo(t.x - 54, t.y); ctx.lineTo(t.x - 340, t.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  /* how many still to go */
  ctx.textAlign = "center";
  ctx.fillStyle = "#f4f4e8"; ctx.font = "bold 15px 'Courier New', monospace";
  ctx.fillText(t.hp + " TO GO", t.x, t.y - 78);
}

function drawRay(t){
  ctx.save(); ctx.translate(t.x, t.y); ctx.scale(-1, 1);
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 18; }
  const u = Math.sin(time * 0.11 + t.phase) * 13;      /* the wing undulation */
  const u2 = Math.sin(time * 0.11 + t.phase + 1.1) * 9;

  /* the whip tail with the barb on it */
  ctx.strokeStyle = "#3b4a63"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-24, 2);
  ctx.quadraticCurveTo(-46, 2 + u * 0.7, -70, 2 + u * 1.5); ctx.stroke();
  ctx.fillStyle = "#20293a";
  ctx.beginPath();
  ctx.moveTo(-66, 2 + u * 1.4); ctx.lineTo(-82, -3 + u * 1.6); ctx.lineTo(-68, 8 + u * 1.5);
  ctx.closePath(); ctx.fill();
  ctx.lineCap = "butt";

  /* the wings, one above and one below, flapping out of phase */
  ctx.fillStyle = "#4a5f80";
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.quadraticCurveTo(6, -14, -12, -22 - u);
  ctx.quadraticCurveTo(-26, -26 - u, -24, -4);
  ctx.quadraticCurveTo(-14, -2, 34, 0);
  ctx.closePath(); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(34, 0);
  ctx.quadraticCurveTo(6, 14, -12, 22 + u2);
  ctx.quadraticCurveTo(-26, 26 + u2, -24, 4);
  ctx.quadraticCurveTo(-14, 2, 34, 0);
  ctx.closePath(); ctx.fill();

  /* the flat body */
  ctx.fillStyle = "#5c7396";
  ctx.beginPath(); ctx.ellipse(6, 0, 30, 13, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#d7e3f0";
  ctx.beginPath(); ctx.ellipse(10, 4, 22, 7, 0, 0, 6.29); ctx.fill();

  /* spots */
  ctx.fillStyle = "rgba(200,220,240,0.5)";
  for (let i = 0; i < 5; i++){
    ctx.beginPath(); ctx.arc(-8 + i * 9, -5 + (i % 2) * 6, 2.6, 0, 6.29); ctx.fill();
  }
  /* eyes on top of the head */
  ctx.fillStyle = "#f3f7fb";
  ctx.beginPath(); ctx.arc(24, -6, 4.2, 0, 6.29); ctx.arc(24, 6, 4.2, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.arc(25, -6, 2.1, 0, 6.29); ctx.arc(25, 6, 2.1, 0, 6.29); ctx.fill();
  ctx.restore();
  pips(t);
}

function drawSub(t, bomber){
  ctx.save(); ctx.translate(t.x,t.y); ctx.scale(-1,1);
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 20; }
  const body = bomber ? "#4a4f56" : "#66727d", trim = bomber ? "#2c3036" : "#49535c";
  ctx.fillStyle = trim;
  ctx.save(); ctx.translate(-58,0); ctx.rotate(time*0.3);
  ctx.beginPath(); ctx.ellipse(0,0,4,15,0,0,6.29); ctx.fill(); ctx.restore();
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(58,0); ctx.quadraticCurveTo(50,-19,10,-20); ctx.lineTo(-40,-16);
  ctx.quadraticCurveTo(-56,-10,-56,0); ctx.quadraticCurveTo(-56,10,-40,16); ctx.lineTo(10,20);
  ctx.quadraticCurveTo(50,19,58,0); ctx.closePath(); ctx.fill();
  ctx.fillStyle = trim; ctx.fillRect(-40,-3,96,5);
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.moveTo(-4,-20); ctx.lineTo(2,-40); ctx.lineTo(24,-40); ctx.lineTo(28,-20); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = trim; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(14,-40); ctx.lineTo(14,-54); ctx.lineTo(26,-54); ctx.stroke();
  ctx.fillStyle = bomber ? "#ff7a4a" : "#9fe2ff";
  for (let i = 0; i < 4; i++){ ctx.beginPath(); ctx.arc(-16+i*18,4,5,0,6.29); ctx.fill(); }
  ctx.fillStyle = trim;
  ctx.beginPath(); ctx.moveTo(-44,-14); ctx.lineTo(-60,-28); ctx.lineTo(-44,-4); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-44,14); ctx.lineTo(-60,28); ctx.lineTo(-44,4); ctx.closePath(); ctx.fill();
  if (bomber){
    ctx.fillStyle = "#b3241c"; ctx.fillRect(34,6,24,10);
    ctx.fillStyle = "#2c3036"; ctx.fillRect(40,-30,16,8);
    ctx.fillStyle = "#ff5a3c"; ctx.beginPath(); ctx.arc(48,-34,4,0,6.29); ctx.fill();
  }
  ctx.restore();
  pips(t);
}

function drawTurtle(x, y, sc, rot){
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(sc, sc);
  const flap = Math.sin(time * 0.16 + x) * 0.5;
  ctx.fillStyle = "#2e7a48";
  ctx.save(); ctx.rotate(flap*0.5);
  ctx.beginPath(); ctx.ellipse(-8,-12,10,5,-0.7,0,6.29); ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(-flap*0.5);
  ctx.beginPath(); ctx.ellipse(-8,12,10,5,0.7,0,6.29); ctx.fill(); ctx.restore();
  ctx.beginPath(); ctx.ellipse(10,-12,8,4,0.5,0,6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(10,12,8,4,-0.5,0,6.29); ctx.fill();
  ctx.fillStyle = "#5cbb70";
  ctx.beginPath(); ctx.ellipse(18,-1,9,7.5,0,0,6.29); ctx.fill();
  ctx.strokeStyle = "#1c5230"; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.ellipse(18,-1,9,7.5,0,0,6.29); ctx.stroke();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(21,-3,1.9,0,6.29); ctx.fill();
  ctx.fillStyle = "#3f9e5a"; ctx.beginPath(); ctx.ellipse(0,0,18,15,0,0,6.29); ctx.fill();
  ctx.strokeStyle = "#1c5230"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0,0,18,15,0,0,6.29); ctx.stroke();
  ctx.fillStyle = "#2b6b3f";
  ctx.beginPath(); ctx.ellipse(0,0,12,10,0,0,6.29); ctx.fill();
  ctx.strokeStyle = "#7fd08c"; ctx.lineWidth = 1.4;
  for (let i = 0; i < 6; i++){
    const a = i / 6 * 6.283;
    ctx.beginPath(); ctx.moveTo(Math.cos(a)*6, Math.sin(a)*5); ctx.lineTo(Math.cos(a)*17, Math.sin(a)*14); ctx.stroke();
  }
  ctx.restore();
}

function drawBag(t){
  const wob = Math.sin(time * 0.035 + t.phase) * 0.08;
  ctx.save();
  ctx.translate(t.x, t.y);
  ctx.rotate(wob);
  ctx.scale(1.16, 1.16);
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 20; }

  /* the sealed neck of the bag, gathered and knotted shut */
  ctx.fillStyle = "rgba(214,242,252,0.72)";
  ctx.beginPath();
  ctx.moveTo(-24, -30); ctx.lineTo(-9, -56); ctx.lineTo(9, -56); ctx.lineTo(24, -30);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(248,254,255,0.95)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-24,-30); ctx.lineTo(-9,-56); ctx.moveTo(24,-30); ctx.lineTo(9,-56); ctx.stroke();

  /* the water the bag is filled with, kept much brighter than the swamp behind it */
  const g = ctx.createLinearGradient(0, -34, 0, 48);
  g.addColorStop(0, "rgba(196,240,255,0.90)");
  g.addColorStop(0.45, "rgba(150,220,246,0.82)");
  g.addColorStop(1, "rgba(108,192,226,0.86)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(-24, -30);
  ctx.bezierCurveTo(-44, -14, -42, 30, -20, 44);
  ctx.bezierCurveTo(-6, 52, 6, 52, 20, 44);
  ctx.bezierCurveTo(42, 30, 44, -14, 24, -30);
  ctx.closePath();
  ctx.fill();

  /* the turtle, sitting in the water inside */
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(-24, -30);
  ctx.bezierCurveTo(-44, -14, -42, 30, -20, 44);
  ctx.bezierCurveTo(-6, 52, 6, 52, 20, 44);
  ctx.bezierCurveTo(42, 30, 44, -14, 24, -30);
  ctx.closePath();
  ctx.clip();
  drawTurtle(0, 12, 1.15, Math.sin(time * 0.05 + t.phase) * 0.26);
  ctx.restore();

  /* the trapped pocket of air at the top */
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.beginPath();
  ctx.moveTo(-23, -28); ctx.bezierCurveTo(-30, -18, 30, -18, 23, -28);
  ctx.closePath(); ctx.fill();

  /* the plastic itself: hard bright rim and two shine streaks */
  ctx.strokeStyle = "rgba(250,255,255,0.98)"; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-24, -30);
  ctx.bezierCurveTo(-44, -14, -42, 30, -20, 44);
  ctx.bezierCurveTo(-6, 52, 6, 52, 20, 44);
  ctx.bezierCurveTo(42, 30, 44, -14, 24, -30);
  ctx.closePath(); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(-26, -12); ctx.quadraticCurveTo(-33, 12, -22, 32); ctx.stroke();
  ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(26, -14); ctx.quadraticCurveTo(33, 8, 24, 30); ctx.stroke();

  /* the knot, the bit you have to burst */
  ctx.fillStyle = "#eaf9ff";
  ctx.beginPath(); ctx.ellipse(-13, -60, 11, 7, -0.6, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(13, -60, 11, 7, 0.6, 0, 6.29); ctx.fill();
  ctx.strokeStyle = "rgba(150,200,220,0.9)"; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(-13, -60, 11, 7, -0.6, 0, 6.29); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(13, -60, 11, 7, 0.6, 0, 6.29); ctx.stroke();
  ctx.fillStyle = "#c9d9e2";
  ctx.beginPath(); ctx.ellipse(0, -56, 9, 6, 0, 0, 6.29); ctx.fill();

  ctx.restore();
}

function drawOcto(t){
  const ready = t.settled !== false;
  /* the arm and the body, held out to the right so the board faces you */
  ctx.save();
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 18; }
  const bx = t.x + 74, by = t.y + 6;
  ctx.strokeStyle = "#8e4a86"; ctx.lineWidth = 9; ctx.lineCap = "round";
  for (let i = 0; i < 5; i++){
    const a = -0.9 + i * 0.45, ln = 34 + (i % 3) * 16;
    ctx.beginPath(); ctx.moveTo(bx + 6, by + 8);
    ctx.quadraticCurveTo(bx + 26 + Math.sin(time*0.05+i)*6, by + 16 + a*22,
                         bx + 6 + ln + Math.sin(time*0.06+i*1.7)*10, by + 26 + a*30);
    ctx.stroke();
  }
  ctx.strokeStyle = "#a35b9b"; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(bx - 4, by - 4);
  ctx.quadraticCurveTo(t.x + 42, t.y - 6, t.x + 22, t.y); ctx.stroke();
  ctx.lineCap = "butt";
  ctx.fillStyle = "#a35b9b";
  ctx.beginPath(); ctx.ellipse(bx + 6, by - 12, 30, 34, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#c479ba";
  ctx.beginPath(); ctx.ellipse(bx + 2, by - 22, 20, 18, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(bx - 8, by - 14, 9, 10, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 14, by - 16, 8, 9, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath(); ctx.ellipse(bx - 10, by - 13, 3.4, 5, 0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.ellipse(bx + 12, by - 15, 3.2, 4.6, 0, 0, 6.29); ctx.fill();
  ctx.restore();

  /* the board. the gold centre is exactly on t.y */
  ctx.save();
  if (t.flash > 0){ ctx.shadowColor = "#fff"; ctx.shadowBlur = 20; }
  ctx.fillStyle = "#f4e6c4"; ctx.beginPath(); ctx.arc(t.x, t.y, 44, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#1f3a4a"; ctx.beginPath(); ctx.arc(t.x, t.y, 40, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#f4f4e8"; ctx.beginPath(); ctx.arc(t.x, t.y, 32, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#b3241c"; ctx.beginPath(); ctx.arc(t.x, t.y, 24, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#f4f4e8"; ctx.beginPath(); ctx.arc(t.x, t.y, 16, 0, 6.29); ctx.fill();
  ctx.fillStyle = ready ? "#ffd45e" : "#8a7330";
  ctx.beginPath(); ctx.arc(t.x, t.y, 9, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#7b1f14"; ctx.beginPath(); ctx.arc(t.x, t.y, 3.4, 0, 6.29); ctx.fill();
  ctx.strokeStyle = "rgba(0,0,0,0.28)"; ctx.lineWidth = 1;
  for (let i = 0; i < 12; i++){
    const a = i / 12 * 6.283;
    ctx.beginPath(); ctx.moveTo(t.x + Math.cos(a)*16, t.y + Math.sin(a)*16);
    ctx.lineTo(t.x + Math.cos(a)*40, t.y + Math.sin(a)*40); ctx.stroke();
  }
  if (ready){
    ctx.strokeStyle = "rgba(255,212,94," + (0.35 + Math.sin(time*0.12)*0.25) + ")";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(t.x, t.y, 13, 0, 6.29); ctx.stroke();
  }
  ctx.restore();
}

function pips(t){
  if (t.maxHp < 2) return;
  const w = 34, x = t.x - w / 2, y = t.y - (t.r + 20);
  ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(x-1,y-1,w+2,7);
  ctx.fillStyle = t.hp > 1 ? "#7ee06a" : "#ffb03a";
  ctx.fillRect(x,y,w*(t.hp/t.maxHp),5);
}

    ctx.fillStyle = "#c0261c"; ctx.beginPath(); ctx.arc(13,0,6,0,6.29); ctx.fill();
    ctx.fillStyle = "#37393e";
    ctx.beginPath(); ctx.moveTo(-16,-6); ctx.lineTo(-24,-12); ctx.lineTo(-18,0); ctx.lineTo(-24,12); ctx.lineTo(-16,6); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function drawBits(){
  for (const b of bits){
    const a = Math.max(0, b.life / b.max);
    ctx.save(); ctx.globalAlpha = a;
    if (b.k === "feather"){ ctx.translate(b.x,b.y); ctx.rotate(b.rot); ctx.fillStyle = b.c;
      ctx.beginPath(); ctx.ellipse(0,0,b.sz,b.sz*0.4,0,0,6.29); ctx.fill(); }
    else if (b.k === "bub"){ ctx.strokeStyle = b.c; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.sz,0,6.29); ctx.stroke(); }
    else if (b.k === "turtle"){ ctx.globalAlpha = Math.min(1, a * 3); drawTurtle(b.x, b.y, 0.9, b.rot); }
    else if (b.k === "plastic"){
      ctx.globalAlpha = a * 0.7; ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.fillStyle = "#e6f6ff";
      ctx.beginPath(); ctx.moveTo(-b.sz,-b.sz*0.5); ctx.lineTo(b.sz*0.7,-b.sz*0.8);
      ctx.lineTo(b.sz, b.sz*0.6); ctx.lineTo(-b.sz*0.6, b.sz*0.4); ctx.closePath(); ctx.fill();
    }
    else { ctx.fillStyle = b.c; ctx.fillRect(b.x-b.sz/2,b.y-b.sz/2,b.sz,b.sz); }
    ctx.restore();
  }
}

function drawHUD(){

    ? (croc.cool > 0 ? "rgba(10,22,30,0.22)" : "rgba(8,18,26,0.62)")

  ctx.lineWidth = sky ? 2.5 : 2;

    const GE = L.guide || LINE_END;
    ctx.beginPath(); ctx.moveTo(croc.x + 52, bowY()); ctx.lineTo(GE, bowY()); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = sky ? "rgba(8,18,26,0.8)" : "rgba(255,212,94,0.5)"; ctx.lineWidth = 2.5;

  /* arcade top bar */

function wrap(text,cx,y,maxW,lh){
  const words = text.split(" ");
  let line = "", lines = [];
  for (const w of words){
    const test = line ? line + " " + w : w;
    if (ctx.measureText(test).width > maxW){ lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  lines.forEach((l,i) => ctx.fillText(l, cx, y+i*lh));
}

function drawLittleCroc(x, y, sc, ph, tone){
  const bob = Math.sin(time * 0.09 + ph) * 4;
  const wave = Math.sin(time * 0.16 + ph);
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(sc, sc);

  const body = tone ? "#5fae52" : "#4f9e46";
  const dark = tone ? "#3a7c38" : "#2f6c30";

  /* tail */
  ctx.fillStyle = dark;
  ctx.beginPath();
  ctx.moveTo(-4, -22);
  ctx.quadraticCurveTo(-30, -20 + wave * 3, -46, -4);
  ctx.quadraticCurveTo(-28, -14, -6, -12);
  ctx.closePath(); ctx.fill();

  /* legs */
  ctx.fillStyle = dark;
  ctx.fillRect(-9, -14, 7, 14); ctx.fillRect(4, -14, 7, 14);

  /* body */
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(0, -28, 14, 17, 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = "#d9e07a";

  ctx.beginPath(); ctx.moveTo(8, -36); ctx.lineTo(18, -50 + wave * 5); ctx.stroke();
  ctx.lineCap = "butt";

  /* head and snout */
  ctx.fillStyle = body;
  ctx.beginPath(); ctx.ellipse(4, -50, 12, 9, 0, 0, 6.29); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(8, -55); ctx.lineTo(32, -53); ctx.lineTo(32, -46); ctx.lineTo(8, -44);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#fff";

  }

  ctx.fillStyle = "#fff9d8"; ctx.beginPath(); ctx.arc(2, -58, 3.2, 0, 6.29); ctx.fill();

function drawMedal(x, y, sc){
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  ctx.strokeStyle = "#b3241c"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-9, -20); ctx.lineTo(-2, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -20); ctx.lineTo(2, 0); ctx.stroke();
  const g = ctx.createRadialGradient(-4, -4, 2, 0, 0, 15);
  g.addColorStop(0, "#fff3bd"); g.addColorStop(0.55, "#ffd45e"); g.addColorStop(1, "#c9871a");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 10, 14, 0, 6.29); ctx.fill();
  ctx.strokeStyle = "#8a5a10"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(0, 10, 14, 0, 6.29); ctx.stroke();
  /* the star */
  ctx.fillStyle = "#8a5a10";
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const a2 = -Math.PI/2 + i * Math.PI/5, r2 = i % 2 ? 3.4 : 8;
    const px = Math.cos(a2) * r2, py = 10 + Math.sin(a2) * r2;
    i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

   ============================================================ */
function drawScene(){
  const L = LEVELS[levelIndex];
  if (L.env === "sky") drawSky(); else drawUnderwater();
  for (const t of targets){
    if (!t.alive) continue;
    const k = SIZE[t.type] || 1;
    ctx.save();
    if (k !== 1){ ctx.translate(t.x, t.y); ctx.scale(k, k); ctx.translate(-t.x, -t.y); }
    switch (t.type){
      case "chickenBalloon": drawChickenBalloon(t); break;
      case "eggBalloon":     drawEggBalloon(t); break;
      case "shark":          drawShark(t); break;
      case "hammer":         drawHammer(t); break;
      case "whale":          drawWhale(t); break;
      case "sub":            drawSub(t,false); break;
      case "bomber":         drawSub(t,true); break;
      case "hunter":         drawHunter(t); break;
      case "bag":            drawBag(t); break;
      case "octo":           drawOcto(t); break;
      case "ray":            drawRay(t); break;
      case "board":          drawBoard(t); break;
    }
    ctx.restore();
  }
  for (const p of hostile) drawHostile(p);
  for (const s of shafts) drawShaft(s);
  drawBits();
  drawCroc();
}

function render(){
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake,shake), rnd(-shake,shake));
  ctx.clearRect(-20,-20,W+40,H+40);
  if (state === "title") drawTitle();
  else if (state === "play"){ drawScene(); drawHUD(); }
  else if (state === "note") drawNote();
  else if (state === "loading") drawLoading();
  else if (state === "dead") drawDead();
  else if (state === "win") drawWin();
  ctx.restore();

  /* CRT scanlines */
  ctx.save();
  ctx.globalAlpha = 0.13 + Math.sin(time * 0.4) * 0.012;
  ctx.fillStyle = "#000";
  for (let y = 0; y < H; y += 3) ctx.fillRect(0, y, W, 1);
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.05; ctx.fillStyle = "#7fe3ff";
  ctx.fillRect(0, (time * 2.2) % H, W, 46);
  ctx.restore();

  const vg = ctx.createRadialGradient(W/2,H/2,260,W/2,H/2,640);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.42)");
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  if (muted){
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.font = "12px 'Courier New', monospace"; ctx.textAlign = "left";
    ctx.fillText("SOUND OFF", 20, H-14);
  }
}

const $ = id => document.getElementById(id);

/* the aim control. it works anywhere on the LEFT side of the screen, around and
   behind the slider, not just precisely on the bar, because everyone holds a
   phone a little differently. the slider itself is the visual guide. */
(function(){
  const pad = $("padL"), knob = $("knob");
  if (!pad) return;
  let id = null;
  const setFromY = cy => {
    const r = pad.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (cy - r.top) / r.height));
    aimY = croc.minY + (croc.maxY - croc.minY) * f;
    if (knob) knob.style.top = (f * 100) + "%";
  };
  /* the whole left zone: from the screen edge to just before the game frame */
  const leftZoneHas = cx => {
    const frame = $("frame");
    if (!frame) return cx < window.innerWidth * 0.32;
    const fr = frame.getBoundingClientRect();
    return cx < fr.left;   /* anywhere left of the playfield */
  };
  window.addEventListener("touchstart", e => {
    if (!TOUCH) return;
    for (const t of e.changedTouches){
      if (id === null && leftZoneHas(t.clientX)){
        e.preventDefault();
        pad.classList.add("used");
        id = t.identifier; setFromY(t.clientY);
      }
    }
  }, {passive:false});
  window.addEventListener("touchmove", e => {
    if (id === null) return;
    for (const t of e.changedTouches){
      if (t.identifier === id){ e.preventDefault(); setFromY(t.clientY); }
    }
  }, {passive:false});
  window.addEventListener("touchend", e => {
    for (const t of e.changedTouches) if (t.identifier === id) id = null;
  });
  window.addEventListener("touchcancel", e => {
    for (const t of e.changedTouches) if (t.identifier === id) id = null;
  });
  /* mouse, for a touchless drag on the bar itself */
  pad.addEventListener("mousedown", e => { setFromY(e.clientY); id = "m"; });
  window.addEventListener("mousemove", e => { if (id === "m") setFromY(e.clientY); });
  window.addEventListener("mouseup", () => { if (id === "m") id = null; });
})();
