/* ============================================================
   SCOREBOARD
   ============================================================ */
let boardCache = null;

/* JSONP, because a plain fetch to Apps Script trips the browser cross origin rules */
function callApi(params, done){
  if (!SCORE_API || SCORE_API.indexOf("/exec") < 0){ done(null); return; }
  const cb = "cbScore" + Math.floor(Math.random() * 1e9);
  const q = [];
  for (const k in params) q.push(encodeURIComponent(k) + "=" + encodeURIComponent(params[k]));
  q.push("callback=" + cb);
  let sc; try { sc = document.createElement("script"); } catch(e){ done(null); return; }
  if (!sc){ done(null); return; }
  let finished = false;
  const cleanup = () => { try { delete window[cb]; } catch(e){} if (sc.parentNode) sc.parentNode.removeChild(sc); };
  window[cb] = data => { finished = true; cleanup(); done(data); };
  sc.onerror = () => { if (!finished){ cleanup(); done(null); } };
  setTimeout(() => { if (!finished){ cleanup(); done(null); } }, 12000);
  sc.src = SCORE_API + "?" + q.join("&");
  document.body.appendChild(sc);
}

function endRun(outcome){
  if (runEnded) return;
  runEnded = true;
  const end = Date.now();
  lastRun = {
    score: score,
    stage: LEVELS[levelIndex].n,
    outcome: outcome,
    seconds: Math.max(0, Math.round((end - (runStart || end)) / 1000)),
    startTime: runStart || end,
    endTime: end,
    device: TOUCH ? "phone" : "desktop"
  };
  showNameCard(outcome);
}

/* ---------- the overlay ---------- */
function showOverlay(which){
  try {
    const o = $("over"), n = $("nameCard"), b = $("boardCard");
    if (!o || !o.classList) return;
    o.classList.add("show");
    if (n && n.classList) n.classList.toggle("show", which === "name");
    if (b && b.classList) b.classList.toggle("show", which === "board");
  } catch (e) {}
}
function hideOverlay(){
  try { const o = $("over"); if (o && o.classList) o.classList.remove("show"); } catch (e) {}
}
function setText(id, t){ try { const n = $(id); if (n) n.textContent = t; } catch(e){} }

function showNameCard(outcome){
  setText("overTitle", outcome === "CLEARED" ? "THE SWAMP IS SAFE" : "GAME OVER");
  setText("overSub", outcome === "CLEARED"
    ? "All ten stages held."
    : "You reached stage " + lastRun.stage + ", " + LEVELS[levelIndex].title);
  setText("overScore", String(lastRun.score));
  setText("saveNote", "");
  try {
    const inp = $("pname");
    if (inp){
      inp.value = "";   /* always blank, so one person's name is not reused */
      setTimeout(() => { try { inp.focus(); } catch(e){} }, 60);
    }
  } catch(e){}
  showOverlay("name");
}

function submitRun(name){
  setText("saveNote", "Saving...");
  try { $("bSave").disabled = true; } catch(e){}
  callApi({
    action: "submit",
    name: name,
    score: lastRun.score,
    stage: lastRun.stage,
    outcome: lastRun.outcome,
    seconds: lastRun.seconds,
    startTime: lastRun.startTime,
    endTime: lastRun.endTime,
    device: lastRun.device
  }, data => {
    try { $("bSave").disabled = false; } catch(e){}
    if (data && data.ok){
      boardCache = data;
      paintBoards(data, name);
    } else {
      paintBoards(null, name);
      setText("myRank", "Could not reach the scoreboard just now.");
    }
    showOverlay("board");
  });
}

function loadBoards(){
  callApi({ action: "board" }, data => {
    boardCache = data;
    paintBoards(data, null);
  });
}

function paintBoards(data, myName){
  if (data && data.ok && data.daily && data.daily.length){
    dayBest = Math.max(dayBest, data.daily[0].score || 0);
  }
  const day = $("dayList"), all = $("allList");
  if (!day || !all || day.innerHTML === undefined) return;
  if (!data || !data.ok){
    day.innerHTML = '<li class="loading">unavailable</li>';
    all.innerHTML = '<li class="loading">unavailable</li>';
    return;
  }
  setText("dayDate", data.today ? "(" + data.today + ", IST)" : "");
  const row = (r, i) => {
    const mine = myName && r.name === myName && r.score === lastRun.score;
    return '<li class="' + (mine ? "me" : "") + '">' +
      '<span class="n">' + (i + 1) + '</span>' +
      '<span class="who">' + escapeHtml(r.name) + '</span>' +
      '<span class="sc">' + r.score + '</span></li>';
  };
  day.innerHTML = data.daily && data.daily.length ? data.daily.map(row).join("") : '<li class="loading">nobody yet today</li>';
  all.innerHTML = data.overall && data.overall.length ? data.overall.map(row).join("") : '<li class="loading">nobody yet</li>';

  if (data.dailyRank || data.overallRank){
    setText("myRank", "You are number " + data.dailyRank + " today and number " + data.overallRank + " of all time.");
  }
}

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- overlay buttons ---------- */
if ($("bSave")) $("bSave").addEventListener("click", () => {
  const v = ($("pname").value || "").trim();
  if (!v){ $("saveNote").textContent = "Type a name first, or press skip."; return; }
  submitRun(v.slice(0, 16));
});
if ($("pname")) $("pname").addEventListener("keydown", e => {
  if (e.code === "Enter" || e.key === "Enter"){ e.preventDefault(); $("bSave").click(); }
  e.stopPropagation();
});
if ($("bSkip")) $("bSkip").addEventListener("click", () => {
  loadBoards();
  $("myRank").textContent = "";
  showOverlay("board");
});
if ($("bPlayAgain")) $("bPlayAgain").addEventListener("click", () => { hideOverlay(); newRun(); });
if ($("bQuit")) $("bQuit").addEventListener("click", goToTitle);

/* ---------- promo slots ---------- */
function promoLogo(pr){
  const initials = (pr.title || "?").replace(/[^A-Za-z\u0900-\u097F]/g, "").slice(0, 2).toUpperCase();
  return '<span class="plogo" style="background:' + pr.tint + '">' +
    (pr.img ? '<img src="' + pr.img + '" alt="" onerror="this.style.display=\'none\';this.parentNode.textContent=\'' + initials + '\'">' : initials) +
    '</span>';
}

/* the small strip that sits under the game */
function promoBox(pr, lineIdx){
  const desc = (pr.intro && pr.intro.length)
    ? pr.intro[(lineIdx || 0) % pr.intro.length]
    : pr.line;
  return '<a class="promoBox" href="' + pr.url + '" target="_blank" rel="noopener">' +
    promoLogo(pr) +
    '<span class="txt"><b>' + escapeHtml(pr.head || pr.title) + '</b><i>' + escapeHtml(desc) + '</i></span>' +
    '<span class="go">' + escapeHtml(pr.cta) + '</span></a>';
}

/* the fuller card for the scoreboard, with a rotating intro line and a big button */
function promoCardBig(pr, i){
  const introId = "intro" + i;
  return '<div class="promoBig">' +
    '<div class="pbLeft">' +
      '<div class="pbHead">' + promoLogo(pr) +
        '<div class="pbTitle"><span class="tag" style="background:' + pr.tint + '">' + escapeHtml(pr.label) + '</span>' +
        '<b>' + escapeHtml(pr.title) + '</b></div></div>' +
      (pr.head ? '<div class="pbFixed">' + escapeHtml(pr.head) + '</div>' : '') +
      '<div class="pbIntro" id="' + introId + '" data-p="' + (i % PROMOS.length) + '">' + escapeHtml((pr.intro && pr.intro[0]) || pr.line) + '</div>' +
    '</div>' +
    '<a class="pbBtn" href="' + pr.url + '" target="_blank" rel="noopener">' +
      escapeHtml(pr.cta) + '</a>' +
    '</div>';
}
function startIntroRotation(){
  setInterval(() => {
    introTick++;
    /* rotate whatever intro lines are actually on the scoreboard right now,
       reading each card's promo index off a data attribute */
    const els = document.querySelectorAll ? document.querySelectorAll(".pbIntro") : [];
    els.forEach(el => {
      const idx = parseInt(el.getAttribute("data-p"), 10);
      const pr = PROMOS[idx];
      if (el.style && pr && pr.intro && pr.intro.length){
        const line = pr.intro[introTick % pr.intro.length];
        el.style.opacity = 0;
        setTimeout(() => { try { el.textContent = line; el.style.opacity = 1; } catch(e){} }, 250);
      }
    });
  }, 15000);
}

let stripLine = 0;
function paintStrip(){
  if (!SHOW_PROMOS || !PROMOS.length) return;
  const strip = $("promoStrip");
  if (strip) strip.innerHTML = promoBox(PROMOS[promoIdx % PROMOS.length], stripLine);
  paintPhoneAd();
}
/* every 15 seconds the descriptive line under the current ad changes */
setInterval(() => {
  try {
    if (!document.querySelector) return;
    stripLine++;
    const el = document.querySelector("#promoStrip .txt i");
    const pr = PROMOS[promoIdx % PROMOS.length];
    if (el && el.style && pr && pr.intro && pr.intro.length){
      el.style.transition = "opacity .3s"; el.style.opacity = 0;
      setTimeout(() => { try { el.textContent = pr.intro[stripLine % pr.intro.length]; el.style.opacity = 1; } catch(e){} }, 300);
    }
  } catch(e){}
}, 15000);
(function(){
  if (!SHOW_PROMOS || !PROMOS.length) return;
  promoIdx = Math.floor(Math.random() * PROMOS.length);
  paintStrip();
  const ov = $("promoOverlay");
  if (ov){
    /* show only two ads here, starting from a shuffled point so different
       players see different pairs and all three get fair exposure */
    const start = Math.floor(Math.random() * PROMOS.length);
    const pick = [PROMOS[start], PROMOS[(start + 1) % PROMOS.length]];
    ov.innerHTML = pick.map((pr, i) => promoCardBig(pr, start + i)).join("");
    startIntroRotation();
  }
  /* on the title screen an ad holds for 20 seconds then changes. once a game is
     running the per-stage advance takes over, so each ad holds for a whole level. */
  setInterval(() => {
    if (state === "title"){
      promoIdx = (promoIdx + 1) % PROMOS.length;
      stripLine = 0;
      paintStrip();
    }
  }, 20000);
})();

/* ---------- the portrait screen: the real title attract scene in the rectangle ---------- */
(function(){
  const dc = document.getElementById("demo");
  if (!dc || !dc.getContext) return;
  const g = dc.getContext("2d");
  let DW = 480, DH = 300;
  function fit(){
    const r = dc.getBoundingClientRect();
    const w = Math.max(240, Math.round(r.width) || 480);
    const h = Math.max(150, Math.round(r.height) || Math.round(w * 10 / 16));
    DW = w; DH = h; dc.width = w; dc.height = h;
  }
  fit();
  window.addEventListener("resize", fit);
  window.addEventListener("orientationchange", () => setTimeout(fit, 120));
  [200, 500, 1000].forEach(ms => setTimeout(fit, ms));

  /* a small self-contained crocodile archer, drawn to the demo context */
  function demoCroc(x, y, sc, firing){
    g.save(); g.translate(x, y); g.scale(sc, sc);
    /* shadow */
    g.fillStyle = "rgba(0,0,0,0.2)"; g.beginPath(); g.ellipse(0, 40, 30, 7, 0, 0, 6.29); g.fill();
    /* tail */
    g.fillStyle = "#2f6c30";
    g.beginPath(); g.moveTo(-6, 10);
    g.quadraticCurveTo(-46, 12 + Math.sin(t*0.06)*5, -70, 34 + Math.sin(t*0.06)*10);
    g.quadraticCurveTo(-40, 26, -8, 24); g.closePath(); g.fill();
    /* body */
    g.fillStyle = "#4f9e46";
    g.beginPath(); g.ellipse(0, 8, 24, 30, 0, 0, 6.29); g.fill();
    g.fillStyle = "#d9e07a"; g.beginPath(); g.ellipse(3, 12, 13, 20, 0, 0, 6.29); g.fill();
    /* legs */
    g.fillStyle = "#4f9e46"; g.fillRect(-16, 30, 12, 16); g.fillRect(6, 30, 12, 16);
    g.fillStyle = "#d9e07a"; g.beginPath(); g.ellipse(-10, 48, 9, 5, 0, 0, 6.29); g.ellipse(12, 48, 9, 5, 0, 0, 6.29); g.fill();
    /* head */
    g.fillStyle = "#4f9e46"; g.beginPath(); g.ellipse(9, -30, 17, 14, 0, 0, 6.29); g.fill();
    g.fillRect(16, -34, 30, 11);   /* snout */
    g.fillStyle = "#fff";
    for (let k = 0; k < 4; k++){ g.beginPath(); g.moveTo(22 + k*6, -23); g.lineTo(25 + k*6, -23); g.lineTo(23 + k*6, -18); g.closePath(); g.fill(); }
    g.fillStyle = "#111"; g.beginPath(); g.arc(6, -34, 3, 0, 6.29); g.fill();
    /* the bow */
    g.strokeStyle = "#7a4a1a"; g.lineWidth = 4;
    g.beginPath(); g.arc(24, -8, 26, -1.15, 1.15); g.stroke();
    if (!firing){
      g.strokeStyle = "#e8d9b0"; g.lineWidth = 2;
      g.beginPath(); g.moveTo(24, -32); g.lineTo(24, 16); g.stroke();
    }
    g.restore();
  }

  const portraitMQ = window.matchMedia ? window.matchMedia("(orientation:portrait)") : null;
  let t = 0;
  function frame(){
    const hasTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    const isPortrait = portraitMQ ? portraitMQ.matches : (window.innerHeight > window.innerWidth);
    if (!(hasTouch && isPortrait)){ requestAnimationFrame(frame); return; }
    t++;

    const S = DW / 480;   /* scale factor from a 480-wide reference */

    /* the sky */
    const sky = g.createLinearGradient(0, 0, 0, DH);
    sky.addColorStop(0, "#8fd2f0"); sky.addColorStop(0.6, "#bfe3f2"); sky.addColorStop(1, "#dff2e0");
    g.fillStyle = sky; g.fillRect(0, 0, DW, DH);
    /* sun */
    g.fillStyle = "rgba(255,238,150,0.5)"; g.beginPath(); g.arc(DW - 50*S, 54*S, 30*S, 0, 6.29); g.fill();
    g.fillStyle = "rgba(255,246,190,0.9)"; g.beginPath(); g.arc(DW - 50*S, 54*S, 18*S, 0, 6.29); g.fill();
    /* clouds */
    g.fillStyle = "rgba(255,255,255,0.85)";
    for (let i = 0; i < 3; i++){
      const cx = ((t * 0.2 + i * 190) % (DW + 120)) - 60;
      const cy = (40 + i * 26) * S;
      g.beginPath(); g.arc(cx, cy, 15*S, 0, 6.29); g.arc(cx + 16*S, cy - 6*S, 18*S, 0, 6.29); g.arc(cx + 34*S, cy, 15*S, 0, 6.29); g.fill();
    }
    /* rolling hills */
    g.fillStyle = "#4e8f43"; g.beginPath(); g.moveTo(0, DH*0.72);
    g.quadraticCurveTo(DW*0.3, DH*0.60, DW*0.6, DH*0.72); g.quadraticCurveTo(DW*0.85, DH*0.80, DW, DH*0.70);
    g.lineTo(DW, DH); g.lineTo(0, DH); g.closePath(); g.fill();
    g.fillStyle = "#3c7a37"; g.beginPath(); g.moveTo(0, DH*0.80);
    g.quadraticCurveTo(DW*0.4, DH*0.70, DW*0.7, DH*0.82); g.quadraticCurveTo(DW*0.9, DH*0.88, DW, DH*0.80);
    g.lineTo(DW, DH); g.lineTo(0, DH); g.closePath(); g.fill();
    /* the water at the bottom */
    g.fillStyle = "#2f6f86"; g.fillRect(0, DH*0.86, DW, DH*0.14);
    g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 1;
    for (let i = 0; i < 3; i++){ g.beginPath(); g.moveTo(0, DH*(0.88 + i*0.03)); g.lineTo(DW, DH*(0.88 + i*0.03)); g.stroke(); }

    /* balloons drifting up the right */
    for (let i = 0; i < 4; i++){
      const bx = DW * (0.55 + i * 0.12);
      const by = (DH + 40) - (((t * 0.7) + i * 120) % (DH + 90));
      g.save(); g.translate(bx, by); g.scale(S, S);
      g.fillStyle = "#e2483a"; g.beginPath(); g.arc(0, 0, 13, 0, 6.29); g.fill();
      g.fillStyle = "rgba(255,255,255,0.4)"; g.beginPath(); g.arc(-4, -4, 4, 0, 6.29); g.fill();
      g.strokeStyle = "rgba(120,30,20,0.6)"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 13); g.lineTo(0, 24); g.stroke();
      /* the little chicken body */
      g.fillStyle = "#c9382c"; g.beginPath(); g.ellipse(0, 30, 8, 6, 0, 0, 6.29); g.fill();
      g.fillStyle = "#ffcf3f"; g.beginPath(); g.moveTo(7, 29); g.lineTo(12, 30); g.lineTo(7, 32); g.closePath(); g.fill();
      g.restore();
    }

    /* the archer on the left bank, firing on a loop */
    const cyc = t % 150;
    demoCroc(48 * S, DH * 0.72, S * 1.05, cyc > 40 && cyc < 120);
    if (cyc > 40 && cyc < 120){
      const ax = 48*S + 40*S + (cyc - 40) * 5 * S;
      const ay = DH * 0.72 - 16 * S;
      g.save(); g.translate(ax, ay); g.scale(S, S);
      g.strokeStyle = "#e8d9b0"; g.lineWidth = 2.5;
      g.beginPath(); g.moveTo(-24, 0); g.lineTo(14, 0); g.stroke();
      g.fillStyle = "#d8dee3"; g.beginPath(); g.moveTo(22, 0); g.lineTo(12, -5); g.lineTo(12, 5); g.closePath(); g.fill();
      g.fillStyle = "#c9382c"; g.beginPath(); g.moveTo(-24, 0); g.lineTo(-16, -5); g.lineTo(-12, 0); g.closePath(); g.fill();
      g.restore();
    }

    /* the game name and mission, across the top */
    g.textAlign = "center";
    g.save(); g.shadowColor = "rgba(0,0,0,0.6)"; g.shadowBlur = 8 * S;
    g.fillStyle = "#c9a227"; g.font = "bold " + Math.round(30 * S) + "px 'Courier New', monospace";
    g.fillText("CROCODILE ARCHER", DW/2, 32 * S);
    g.restore();
    g.fillStyle = "#2f6c30"; g.font = "bold " + Math.round(12 * S) + "px 'Courier New', monospace";
    g.fillText("MISSION - DEFEND THE SWAMP", DW/2, 50 * S);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

/* ============================================================
   HARD SIZE ENFORCER (phone landscape)
   Measures the real space and sets the canvas pixels directly, so the entire
   playfield including the HUD is always visible no matter what the browser does.
   ============================================================ */
function enforceCanvasSize(){
  try {
    const cv = document.getElementById("game");
    if (!cv) return;
    /* on phone the top is the ad strip; on desktop it is the button bar */
    const phoneAd = document.getElementById("phoneAd");
    const bar = (phoneAd && getComputedStyle(phoneAd).display !== "none") ? phoneAd
              : document.getElementById("bar");

    const vvh0 = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    const landscape = window.innerWidth > window.innerHeight;
    /* size for any small landscape screen (a phone), regardless of touch state,
       so the whole rectangle is correct even before the first touch */
    const isPhoneLandscape = landscape && vvh0 <= 700 && ("ontouchstart" in window || navigator.maxTouchPoints > 0);

    if (!isPhoneLandscape){
      cv.style.width = "";
      cv.style.height = "";
      cv.style.maxWidth = "";
      cv.style.maxHeight = "";
      return;
    }

    const vv = window.visualViewport;
    const vw = (vv && vv.width) ? vv.width : window.innerWidth;
    const vh = (vv && vv.height) ? vv.height : window.innerHeight;
    const barH = bar ? Math.ceil(bar.getBoundingClientRect().height) : 30;

    /* the ad strip under the game, if it is showing, also takes height */
    const strip = document.getElementById("promoStrip");
    let stripH = 0;
    if (strip){
      const r = strip.getBoundingClientRect();
      if (r.height > 0 && getComputedStyle(strip).display !== "none") stripH = Math.ceil(r.height);
    }

    /* pin the app to the true visible height so nothing sits under the URL bar */
    const app = document.getElementById("app");
    if (app){ app.style.height = Math.floor(vh) + "px"; app.style.maxHeight = Math.floor(vh) + "px"; }

    /* STEP 1: the whole 600px-tall rectangle MUST fit in the gap between the bar
       (top) and the strip (bottom), minus the frame border and a safety margin. */
    const frameBorder = 4;   /* 2px each side */
    const margin = 14;       /* generous so nothing ever clips */
    const availH = vh - barH - stripH - frameBorder - margin;

    /* STEP 2: whatever width the pads+labels need, the canvas gets the rest. */
    const reservedSides = 44 + 52 + 26 + 26 + 12 + frameBorder;
    const availW = vw - reservedSides;

    /* fit the 16:10 rectangle inside BOTH limits, height first so it never clips */
    const ar = 960 / 600;
    let h = availH;
    let w = h * ar;
    if (w > availW){ w = availW; h = w / ar; }

    w = Math.floor(w); h = Math.floor(h);
    cv.style.width = w + "px";
    cv.style.height = h + "px";
    cv.style.maxWidth = "none";
    cv.style.maxHeight = "none";

    /* the pads match the canvas height exactly, so the knob travels the full range
       and the crocodile reaches top and bottom without going off screen */
    ["padL","padR"].forEach(id => {
      const el = document.getElementById(id);
      if (el){ el.style.height = h + "px"; el.style.maxHeight = "none"; }
    });
    document.querySelectorAll(".padLabel").forEach(el => {
      el.style.height = h + "px"; el.style.maxHeight = "none";
    });
  } catch(e){}
}
window.addEventListener("resize", enforceCanvasSize);
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", enforceCanvasSize);
  window.visualViewport.addEventListener("scroll", enforceCanvasSize);
}
window.addEventListener("orientationchange", () => { setTimeout(enforceCanvasSize, 150); setTimeout(enforceCanvasSize, 500); });
[0, 60, 200, 400, 800, 1500].forEach(ms => setTimeout(enforceCanvasSize, ms));
/* re-check for the first few seconds of play, since mobile browsers resize their
   toolbars as you scroll and can change the available height */
let enfN = 0;
const enfTimer = setInterval(() => { enforceCanvasSize(); if (++enfN > 20) clearInterval(enfTimer); }, 500);
let last = performance.now();
function loop(now){
  let dt = (now - last) / 16.6667; last = now;
  if (dt > 3) dt = 3;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
